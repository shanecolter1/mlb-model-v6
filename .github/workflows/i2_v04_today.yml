name: I2 v0.4 production daily rerun

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v04:
    runs-on: ubuntu-latest
    env:
      I2_ROSTERRESOURCE_SNAPSHOT: config/i2_rosterresource_snapshot.json
      I2_BASEBALL_REPORTS: config/i2_baseball_reports.json
      SPORTSBOOK_DATA_SOURCE: SPORTSGAMEODDS
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set date
        run: echo "I2_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Capture required pre-freeze run environment
        env:
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ env.I2_DATE }}_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
        run: node src/pipeline/fetch_i2_run_environment.mjs

      - name: Refresh preliminary baseball lineups
        env:
          I2_LINEUP_OVERRIDES: data/runtime/i2/${{ env.I2_DATE }}_lineup_overrides.json
          I2_PRELIM_LOOKBACK_DAYS: '7'
        run: node src/pipeline/build_preliminary_lineups_from_last_game.mjs
      - name: Run parent baseball model from self-contained repository pipeline
        env:
          I2_CUTOFF: '1970-01-01T00:00:00Z'
          I2_TRIALS: '50000'
          I2_OUTPUT: data/runtime/i2/${{ env.I2_DATE }}_v04_parent_predictions.json
          I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
          I2_LINEUP_OVERRIDES: data/runtime/i2/${{ env.I2_DATE }}_lineup_overrides.json
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ env.I2_DATE }}_run_environment.json
          I2_TOTAL_PRIOR: data/derived/i2/i2_total_conditioned_prior.json
        run: node src/pipeline/run_i2_total_conditioned.mjs
      - name: Apply promoted Local-CV calibration
        env:
          I2_INPUT: data/runtime/i2/${{ env.I2_DATE }}_v04_parent_predictions.json
          I2_OUTPUT: data/runtime/i2/${{ env.I2_DATE }}_v04_predictions.json
        run: node src/pipeline/apply_i2_v04_local_cv.mjs
      - name: Write candidate-gate summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=process.env.I2_DATE;
          const out=JSON.parse(fs.readFileSync(`data/runtime/i2/${d}_v04_predictions.json`,'utf8'));
          const underGate=61.5;
          const rows=(out.ranking||[]).map(r=>({rank:r.rank,gamePk:r.gamePk,matchup:r.matchup,total:r.runEnvironment?.fullGameTotal??null,under05Pct:r.under05Pct,over05Pct:r.over05Pct,fairUnder:r.fairUnder,fairOver:r.fairOver,localCvBin:r.v04Calibration?.localCvBin??null,shrinkage:r.v04Calibration?.localCvShrinkage??null,predictionClass:r.predictionClass||null,underQualified:Number(r.under05Pct)>=underGate}));
          const summary={date:d,model:out.model,generatedAt:new Date().toISOString(),underGateStatus:'CANDIDATE_PENDING_FULL_RETEST',underThresholdPct:underGate,qualifiedUnders:rows.filter(x=>x.underQualified),ranking:rows};
          fs.writeFileSync(`data/runtime/i2/${d}_v04_summary.json`,JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Commit v0.4 artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          DATE="${I2_DATE}"
          FILES=(
            "data/runtime/i2/${DATE}_lineup_overrides.json"
            "data/runtime/i2/${DATE}_v04_parent_predictions.json"
            "data/runtime/i2/${DATE}_v04_predictions.json"
            "data/runtime/i2/${DATE}_v04_summary.json"
          )
          mkdir -p /tmp/i2-v04
          for file in "${FILES[@]}"; do cp "$file" "/tmp/i2-v04/$(basename "$file")"; done
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/runtime/i2
            for file in "${FILES[@]}"; do cp "/tmp/i2-v04/$(basename "$file")" "$file"; done
            git add "${FILES[@]}"
            if git diff --cached --quiet; then
              echo 'No v0.4 artifact changes.'
              exit 0
            fi
            git commit -m "Run I2 v0.4 production slate ${DATE}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; refreshing main and retrying."
          done
          echo 'Unable to push v0.4 artifacts after 3 attempts.'
          exit 1
