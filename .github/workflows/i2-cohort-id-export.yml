name: I2 Cohort ID Export
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
    paths:
      - '.github/workflows/i2-cohort-id-export.yml'
      - 'scripts/i2_export_cohort_ids.py'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Retrosheet
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
      - name: Export exact cohort IDs
        run: python scripts/i2_export_cohort_ids.py
