name: I2 vNext Phase 20 - half contrast shadow integration

on:
  workflow_dispatch:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase20_half_contrast_shadow.yml'

permissions:
  contents: write

concurrency:
  group: i2-vnext-phase20-half-contrast-shadow
  cancel-in-progress: true

jobs:
  shadow-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify governed half-contrast artifact
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {applyHalfScoreContrast, validateHalfContrastArtifact} from './src/model/i2_half_contrast.js';

          const artifact=JSON.parse(fs.readFileSync('data/derived/i2_vnext/i2_vnext_half_contrast.json','utf8'));
          const checkpoint=JSON.parse(fs.readFileSync('data/derived/i2_vnext/PHASE19_CHECKPOINT.json','utf8'));
          validateHalfContrastArtifact(artifact);
          assert.equal(artifact.market_inputs_used,false);
          assert.equal(artifact.matched_home_venue_only,true);
          assert.equal(artifact.common_component_applied,false);
          assert.equal(artifact.prospective_validation_start,'2026-09-28');
          assert.equal(artifact.zero_sum_half_contrast_h,checkpoint.candidate.zero_sum_half_contrast_h);
          assert.equal(artifact.top_logit_delta,-artifact.zero_sum_half_contrast_h);
          assert.equal(artifact.bottom_logit_delta,artifact.zero_sum_half_contrast_h);

          const rawTop=0.25, rawBottom=0.25;
          const x=applyHalfScoreContrast({topScoreProbability:rawTop,bottomScoreProbability:rawBottom,artifact});
          assert.ok(x.adjustedTopScoreProbability < rawTop);
          assert.ok(x.adjustedBottomScoreProbability > rawBottom);
          const logit=p=>Math.log(p/(1-p));
          assert.ok(Math.abs((logit(x.adjustedTopScoreProbability)-logit(rawTop))+artifact.zero_sum_half_contrast_h)<1e-12);
          assert.ok(Math.abs((logit(x.adjustedBottomScoreProbability)-logit(rawBottom))-artifact.zero_sum_half_contrast_h)<1e-12);
          assert.ok(Math.abs(x.adjustedUnder05-(1-x.adjustedTopScoreProbability)*(1-x.adjustedBottomScoreProbability))<1e-12);
          console.log({artifact:artifact.version,h:artifact.zero_sum_half_contrast_h,test:x});
          NODE

      - name: Verify shadow runner syntax and ordering hooks
        run: |
          node --check src/model/i2_half_contrast.js
          node --check src/pipeline/run_i2_vnext_today.mjs
          python - <<'PY'
          from pathlib import Path
          t=Path('src/pipeline/run_i2_vnext_today.mjs').read_text()
          i_raw=t.index('const rawUnder05 = result.under05')
          i_half=t.index('const halfAdjustedUnder05')
          i_final=t.index('const finalUnder05 = applyFinalCalibration(halfAdjustedUnder05)')
          assert i_raw < i_half < i_final
          assert "Boolean(vnextHalfContrast && venueProfile)" in t
          assert 'rawTop2ScoreProbability' in t
          assert 'rawBottom2ScoreProbability' in t
          assert 'top2ScoreProbability:halfContrast.adjustedTopScoreProbability' in t
          assert 'bottom2ScoreProbability:halfContrast.adjustedBottomScoreProbability' in t
          print({'ordering':'raw -> half contrast -> final calibration','venue_scope':'matched profile only'})
          PY

      - name: Install bounded park dependencies
        run: python -m pip install --upgrade pip pandas requests lxml html5lib beautifulsoup4

      - name: Build current Savant venue profiles
        run: |
          mkdir -p data/runtime/i2
          python src/build_savant_venue_profiles.py             --year 2026             --rolling 3             --output-dir data/runtime/i2
          test -s data/runtime/i2/savant_venue_profiles_2026_3yr.json

      - name: Run 2026-09-28 baseball-only shadow
        env:
          I2_DATE: '2026-09-28'
          I2_CUTOFF: '2026-09-28T00:00:00-05:00'
          I2_TRIALS: '10000'
          I2_OUTPUT: 'data/runtime/i2/2026-09-28_vnext_phase20.json'
          I2_VENUE_PROFILES: 'data/runtime/i2/savant_venue_profiles_2026_3yr.json'
          I2_VNEXT_HALF_CONTRAST: 'data/derived/i2_vnext/i2_vnext_half_contrast.json'
        run: node src/pipeline/run_i2_vnext_today.mjs

      - name: Verify half-contrast shadow behavior
        run: |
          python - <<'PY'
          import json, math
          from collections import Counter
          from pathlib import Path

          path=Path('data/runtime/i2/2026-09-28_vnext_phase20.json')
          m=json.loads(path.read_text())
          art=json.loads(Path('data/derived/i2_vnext/i2_vnext_half_contrast.json').read_text())
          h=art['zero_sum_half_contrast_h']

          assert m['marketDataUsed'] is False
          assert m['promotionStatus']=='SHADOW_ONLY_PROSPECTIVE_VALIDATION_REQUIRED'
          assert m['prospectiveValidationStart']=='2026-09-28'
          assert m['halfCalibration']['version']==art['version']
          assert m['halfCalibration']['matchedHomeVenueOnly'] is True
          assert abs(m['halfCalibration']['h']-h)<1e-15
          assert m['trialsPerGame']==10000
          assert not any((g.get('bettingEligibility') or {}).get('eligible') is True for g in m.get('games',[]))

          curve=m.get('finalCalibration') or {}
          curve_type=str(curve.get('type','identity'))
          assert curve_type in ('none','identity'), curve

          frozen=[g for g in m.get('games',[]) if g.get('modelStatus')=='FROZEN_VNEXT_SHADOW_PROJECTION']
          assert frozen, 'No frozen shadow projections'
          matched=[g for g in frozen if (g.get('dataAudit') or {}).get('venueProfileMatched')]
          unmatched=[g for g in frozen if not (g.get('dataAudit') or {}).get('venueProfileMatched')]
          assert matched, 'No matched-venue frozen projections'

          for g in matched:
              assert g['halfContrastApplied'] is True
              assert abs(g['halfContrastH']-h)<1e-15
              rt=float(g['rawTop2ScoreProbability'])
              rb=float(g['rawBottom2ScoreProbability'])
              at=float(g['top2ScoreProbability'])
              ab=float(g['bottom2ScoreProbability'])
              assert at < rt, (g['gamePk'],rt,at)
              assert ab > rb, (g['gamePk'],rb,ab)
              expected=(1-at)*(1-ab)
              assert abs(float(g['halfAdjustedUnder05'])-expected)<1e-12
              if curve_type in ('none','identity'):
                  assert abs(float(g['under05'])-float(g['halfAdjustedUnder05']))<1e-12

          for g in unmatched:
              assert g['halfContrastApplied'] is False
              assert abs(float(g['top2ScoreProbability'])-float(g['rawTop2ScoreProbability']))<1e-15
              assert abs(float(g['bottom2ScoreProbability'])-float(g['rawBottom2ScoreProbability']))<1e-15

          checkpoint={
              'version':'i2-vnext-phase20-half-contrast-shadow-v1',
              'date':m['date'],
              'cutoff':m['cutoff'],
              'generatedAt':m['generatedAt'],
              'marketDataUsed':False,
              'promotionStatus':m['promotionStatus'],
              'prospectiveValidationStart':m['prospectiveValidationStart'],
              'halfCalibration':m['halfCalibration'],
              'finalCalibration':m['finalCalibration'],
              'remainingGamesAtCutoff':m['remainingGamesAtCutoff'],
              'projectedGames':m['projectedGames'],
              'pendingOrErroredGames':m['pendingOrErroredGames'],
              'frozenGames':len(frozen),
              'matchedContrastApplied':len(matched),
              'unmatchedContrastNotApplied':len(unmatched),
              'modelStatusCounts':dict(Counter(g.get('modelStatus','MISSING') for g in m.get('games',[]))),
              'predictionClassCounts':dict(Counter(g.get('predictionClass','MISSING') for g in m.get('games',[]))),
              'sampleMatched':[
                  {
                      'gamePk':g['gamePk'],
                      'matchup':f"{g['away']} @ {g['home']}",
                      'rawTop2ScoreProbability':g['rawTop2ScoreProbability'],
                      'top2ScoreProbability':g['top2ScoreProbability'],
                      'rawBottom2ScoreProbability':g['rawBottom2ScoreProbability'],
                      'bottom2ScoreProbability':g['bottom2ScoreProbability'],
                      'rawUnder05':g['rawUnder05'],
                      'halfAdjustedUnder05':g['halfAdjustedUnder05'],
                      'finalUnder05':g['under05'],
                  }
                  for g in matched[:5]
              ],
              'governance':{
                  'productionChanged':False,
                  'bettingEligibleOutputs':sum(bool((g.get('bettingEligibility') or {}).get('eligible')) for g in m.get('games',[])),
                  'commonCalibrationAppliedInHalfLayer':False,
                  'halfContrastMatchedVenueOnly':True,
              },
          }
          assert checkpoint['governance']['bettingEligibleOutputs']==0
          Path('data/derived/i2_vnext/PHASE20_CHECKPOINT.json').write_text(json.dumps(checkpoint,indent=2)+'\n')
          print(json.dumps(checkpoint,indent=2))
          PY

      - name: Upload Phase 20 evidence
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase20-half-contrast-shadow
          if-no-files-found: error
          retention-days: 14
          path: |
            data/runtime/i2/2026-09-28_vnext_phase20.json
            data/runtime/i2/savant_venue_profiles_2026_3yr.json
            data/derived/i2_vnext/PHASE20_CHECKPOINT.json

      - name: Commit compact Phase 20 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/PHASE20_CHECKPOINT.json
          if git diff --cached --quiet; then
            echo "No Phase 20 checkpoint change"
          else
            git commit -m "research: checkpoint half contrast shadow integration"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
