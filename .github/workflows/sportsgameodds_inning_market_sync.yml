name: Sync SportsGameOdds MLB inning markets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sportsgameodds_inning_market_sync.yml'
      - 'src/market/sportsgameodds_data_source.mjs'
      - 'src/pipeline/fetch_sgo_mlb_inning_markets.mjs'
      - 'tests/sportsgameodds_data_source.test.mjs'
  workflow_run:
    workflows: ['Run I2 daily slate']
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'MLB slate date (YYYY-MM-DD); defaults to America/Chicago today'
        required: false
      bookmakers:
        description: 'Comma-separated SportsGameOdds bookmaker IDs'
        required: false
        default: 'draftkings,fanduel,betmgm,caesars'

permissions:
  contents: write
  actions: read

concurrency:
  group: sportsgameodds-inning-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve slate date
        id: params
        shell: bash
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          set -euo pipefail
          DATE="${DATE_INPUT:-}"
          if [ -z "$DATE" ]; then
            DATE="$(TZ=America/Chicago date +%F)"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Using MLB slate date $DATE"

      - name: Check SportsGameOdds configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SPORTSGAMEODDS_API_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SPORTSGAMEODDS_API_KEY is not configured; live post-freeze sync skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SportsGameOdds authentication
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { fetchMlbMarketSupport } from './src/market/sportsgameodds_data_source.mjs';
          const response = await fetchMlbMarketSupport({
            oddIDs: ['points-all-2i-ou-over'],
          });
          const data = Array.isArray(response?.data) ? response.data : [];
          console.log(JSON.stringify({
            authenticated: true,
            league: 'MLB',
            requestedOddID: 'points-all-2i-ou-over',
            note: 'Bookmaker-specific availability is verified on /events after freeze',
            returnedMarketRecords: data.length,
          }, null, 2));
          NODE

      - name: Check for existing frozen projection
        if: steps.config.outputs.configured == 'true'
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          FILE="data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json"
          if [ -f "$FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frozen projection already present: $FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frozen projection is not committed; sync will restore a prior frozen production artifact if available, otherwise rebuild before any SportsGameOdds price request." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore prior frozen production artifact when available
        if: steps.config.outputs.configured == 'true' && steps.frozen.outputs.exists != 'true'
        id: restore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="${{ steps.params.outputs.date }}"
          NAME="i2-requested-${DATE}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=100"
          META="$(curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API")"
          ARTIFACT_ID="$(printf '%s' "$META" | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const j=JSON.parse(s);
              const a=(j.artifacts||[]).filter(x=>!x.expired).sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at)))[0];
              if(a) process.stdout.write(String(a.id));
            });
          ")"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No prior frozen production artifact found for ${DATE}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsSL -L             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o /tmp/i2-frozen-source.zip
          rm -rf /tmp/i2-frozen-source
          mkdir -p /tmp/i2-frozen-source "data/runtime/i2"
          unzip -q /tmp/i2-frozen-source.zip -d /tmp/i2-frozen-source
          SRC="$(find /tmp/i2-frozen-source -type f -name "${DATE}_requested_v04.json" | head -n 1)"
          if [ -z "$SRC" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Artifact ${ARTIFACT_ID} did not contain ${DATE}_requested_v04.json." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$SRC" "data/runtime/i2/${DATE}_frozen_predictions.json"
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Restored frozen v0.4 production projection from artifact ${ARTIFACT_ID}." >> "$GITHUB_STEP_SUMMARY"

      - name: Capture approved pre-freeze run environment
        if: steps.config.outputs.configured == 'true' && steps.frozen.outputs.exists != 'true' && steps.restore.outputs.restored != 'true'
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ steps.params.outputs.date }}_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
        run: node src/pipeline/fetch_i2_run_environment.mjs

      - name: Build preliminary lineup fallback
        if: steps.config.outputs.configured == 'true' && steps.frozen.outputs.exists != 'true' && steps.restore.outputs.restored != 'true'
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_LINEUP_OVERRIDES: data/runtime/i2/${{ steps.params.outputs.date }}_lineup_overrides.json
          I2_PRELIM_LOOKBACK_DAYS: '7'
        run: node src/pipeline/build_preliminary_lineups_from_last_game.mjs

      - name: Generate unchanged parent projection before market access
        if: steps.config.outputs.configured == 'true' && steps.frozen.outputs.exists != 'true' && steps.restore.outputs.restored != 'true'
        env:
          MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_CUTOFF: '1970-01-01T00:00:00Z'
          I2_TRIALS: '50000'
          I2_OUTPUT: data/runtime/i2/${{ steps.params.outputs.date }}_sgo_parent_predictions.json
          I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
          I2_LINEUP_OVERRIDES: data/runtime/i2/${{ steps.params.outputs.date }}_lineup_overrides.json
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ steps.params.outputs.date }}_run_environment.json
          I2_TOTAL_PRIOR: data/derived/i2/i2_total_conditioned_prior.json
        run: node src/pipeline/run_i2_total_conditioned.mjs

      - name: Freeze production-calibrated projection
        if: steps.config.outputs.configured == 'true' && steps.frozen.outputs.exists != 'true' && steps.restore.outputs.restored != 'true'
        env:
          I2_INPUT: data/runtime/i2/${{ steps.params.outputs.date }}_sgo_parent_predictions.json
          I2_OUTPUT: data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json
        run: node src/pipeline/apply_i2_v04_local_cv.mjs

      - name: Verify frozen projection exists
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json"
          test -f "$FILE"
          echo "Frozen production projection verified before SportsGameOdds access: $FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Run adapter unit test
        run: node tests/sportsgameodds_data_source.test.mjs

      - name: Fetch post-freeze inning and half-inning prices
        if: steps.config.outputs.configured == 'true'
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_TIME_ZONE: America/Chicago
          FROZEN_PROJECTION_PATH: data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json
          SGO_BOOKMAKERS: ${{ inputs.bookmakers || 'draftkings,fanduel,betmgm,caesars' }}
          SGO_INCLUDE_OPEN_CLOSE: 'false'
          SGO_INCLUDE_ALT_LINES: 'true'
        run: node src/pipeline/fetch_sgo_mlb_inning_markets.mjs

      - name: Upload normalized price board
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sportsgameodds-inning-markets-${{ steps.params.outputs.date }}
          path: |
            data/runtime/i2/${{ steps.params.outputs.date }}_sportsgameodds_inning_markets.json
            data/runtime/i2/${{ steps.params.outputs.date }}_sportsgameodds_market_support.json
            docs/inning_markets/${{ steps.params.outputs.date }}_sportsgameodds_inning_markets.csv
          retention-days: 90

      - name: Commit post-freeze market artifacts
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.params.outputs.date }}"
          JSON="data/runtime/i2/${DATE}_sportsgameodds_inning_markets.json"
          SUPPORT="data/runtime/i2/${DATE}_sportsgameodds_market_support.json"
          CSV="docs/inning_markets/${DATE}_sportsgameodds_inning_markets.csv"
          cp "$JSON" /tmp/sgo-markets.json
          cp "$SUPPORT" /tmp/sgo-support.json
          cp "$CSV" /tmp/sgo-markets.csv

          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "data/runtime/i2" "docs/inning_markets"
            cp /tmp/sgo-markets.json "$JSON"
            cp /tmp/sgo-support.json "$SUPPORT"
            cp /tmp/sgo-markets.csv "$CSV"
            git add "$JSON" "$SUPPORT" "$CSV"
            if git diff --cached --quiet; then
              echo "No SportsGameOdds artifact changes."
              exit 0
            fi
            git commit -m "Update SportsGameOdds inning markets ${DATE}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying."
          done

          echo "Unable to push SportsGameOdds artifacts after 3 attempts."
          exit 1
