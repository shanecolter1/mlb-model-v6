name: I2 vNext Phase 4B - full replay

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - 'data/derived/i2_vnext/phase4a_prep_manifest.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: i2-vnext-phase4b-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore Phase 4A replay prep
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-phase4a-replay-prep
          path: data/derived/i2_vnext
          run-id: 36277316668
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen PA model
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-frozen-pa-model
          path: data/derived/i2_vnext
          run-id: 36273567216
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen baseball data
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-data-phase
          path: data/derived/i2_vnext
          run-id: 36273567216
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Phase 4A checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/derived/i2_vnext/phase4a_prep_manifest.json').read_text())
          assert m['market_inputs_used'] is False
          assert m['i1_state_selected'] == 'player_asof'
          assert m['i1_selection_year'] == 2024
          assert m['replay_season'] == 2025
          assert m['2025_outcomes_used_for_model_selection'] is False
          assert m['replay_games'] >= 2000
          print(json.dumps(m,indent=2))
          PY

      - name: Run untouched 2025 full-I2 replay
        run: |
          node src/research/run_i2_vnext_replay.mjs \
            --trials 2500 \
            --i1-mode player_asof \
            --input data/derived/i2_vnext/replay_2025_inputs.json \
            --model data/derived/i2_vnext/i2_vnext_event_model.json \
            --walkforward-manifest data/derived/i2_vnext/walkforward_2025/manifest.json \
            --arsenal data/derived/i2_vnext/arsenal_profile_2024.json \
            --parks data/derived/i2_vnext/park/savant_venue_profiles_2024_3yr.json \
            --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json \
            --output data/derived/i2_vnext/replay_2025_predictions.json

      - name: Verify replay governance and checkpoint metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('data/derived/i2_vnext/replay_2025_predictions.json')
          m=json.loads(p.read_text())
          assert m['market_inputs_used'] is False
          assert m['observed_i2_state_used_as_predictor'] is False
          assert m['point_in_time_player_refits'] is True
          assert m['walkforward_policy']['point_in_time'] is True
          assert m['i1_state_mode'] == 'player_asof'
          assert m['i1_state_model']['player_specific_i1_talent_used'] is True
          assert m['i1_player_asof_model']['hitter_prior_strength_pa'] == 100
          assert m['i1_player_asof_model']['pitcher_prior_strength_bf'] == 180
          assert m['n'] >= 2000
          assert 0 < m['raw_brier'] < 1
          assert 0 < m['raw_logloss'] < 2

          checkpoint={
            'version':'i2-vnext-phase4b-replay-v1',
            'market_inputs_used':False,
            'season':m['season'],
            'n':m['n'],
            'raw_brier':m['raw_brier'],
            'raw_logloss':m['raw_logloss'],
            'park_match_rate':m['park_match_rate'],
            'trials_per_game':m['trials_per_game'],
            'i1_state_mode':m['i1_state_mode'],
            'point_in_time_player_refits':m['point_in_time_player_refits'],
            'walkforward_cadence':m['walkforward_policy']['cadence'],
            'observed_i2_state_used_as_predictor':m['observed_i2_state_used_as_predictor'],
            'calibration_applied':False,
          }
          Path('data/derived/i2_vnext/phase4b_replay_manifest.json').write_text(json.dumps(checkpoint,indent=2))
          print(json.dumps(checkpoint,indent=2))
          PY

      - name: Upload durable Phase 4B replay
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase4b-replay-2025
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/replay_2025_predictions.json
            data/derived/i2_vnext/phase4b_replay_manifest.json

      - name: Commit compact Phase 4B checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/phase4b_replay_manifest.json
          if git diff --cached --quiet; then
            echo "No Phase 4B checkpoint change"
          else
            git commit -m "research: checkpoint I2 vNext Phase 4B replay"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
