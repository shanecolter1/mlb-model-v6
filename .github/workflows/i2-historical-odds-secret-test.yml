name: I2 Historical Odds Secret Test
on:
  push:
    branches: [analysis/i2-weekday-edge-20260906]
    paths: ['.github/workflows/i2-historical-odds-secret-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, urllib.parse, urllib.request
          key=os.getenv('ODDS_API_KEY','')
          print('SECRET_PRESENT', bool(key))
          if not key:
              raise SystemExit(0)
          params={
            'apiKey':key,
            'regions':'us',
            'markets':'totals',
            'bookmakers':'draftkings',
            'oddsFormat':'american',
            'date':'2021-05-16T12:00:00Z'
          }
          url='https://api.the-odds-api.com/v4/historical/sports/baseball_mlb/odds?'+urllib.parse.urlencode(params)
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  body=r.read().decode('utf-8')
                  print('HTTP', r.status)
                  print('X_REQUESTS_REMAINING', r.headers.get('x-requests-remaining'))
                  obj=json.loads(body)
                  print('SNAPSHOT', obj.get('timestamp'))
                  rows=[]
                  for ev in obj.get('data',[]):
                      for b in ev.get('bookmakers',[]):
                          if b.get('key')!='draftkings': continue
                          for m in b.get('markets',[]):
                              if m.get('key')!='totals': continue
                              out={str(o.get('name')).lower():o for o in m.get('outcomes',[])}
                              over=out.get('over'); under=out.get('under')
                              if over and under:
                                  rows.append((ev.get('away_team'),ev.get('home_team'),ev.get('commence_time'),over.get('point'),over.get('price'),under.get('price')))
                  print('DK_TOTAL_ROWS',len(rows))
                  for row in rows[:25]: print('ROW',*row,sep='|')
          except Exception as e:
              print('ERROR', type(e).__name__, str(e))
          PY
