name: I2 Market Pricing Test

on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
    paths:
      - '.github/workflows/i2-market-pricing-test.yml'
      - 'scripts/i2_market_pricing_test.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/i2-weekday-edge-20260906

      - name: Download Retrosheet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done

      - name: Download joined MLB/DK master
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/shanecolter1/mlb-model-v6/releases/download/historical-mlb-2021-2025-v1/MLB_Game_Stats_Joined_2021_2025.csv.gz" \
            -o /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz
          echo "8512a4fc2fc8e8566d62080bcf006ab6dbdc953e95c3eb8725b55c47a8dafee5  /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz" | sha256sum -c -
          gunzip -f /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz

      - name: Run exact cohort x market test
        run: python scripts/i2_market_pricing_test.py

      - name: Commit result tables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/i2_market_pricing/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "analysis: exact I2 cohort market-pricing results"
            git push origin HEAD:analysis/i2-weekday-edge-20260906
          fi
