name: I2 historical exact overlay

on:
  push:
    branches:
      - research/i2-v0.4-local-cv-production
    paths:
      - 'src/analysis/i2_historical_exact_overlay.py'
      - '.github/workflows/i2_historical_exact_overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen Phase 1 historical store
        run: |
          mkdir -p /tmp/phase1
          gh release download i2-phase1-historical-store-v1 -p 'i2-phase1-frozen-historical-store-2021-2025.tar.gz' -D /tmp/phase1
          mkdir -p /tmp/phase1/ex
          tar -xzf /tmp/phase1/i2-phase1-frozen-historical-store-2021-2025.tar.gz -C /tmp/phase1/ex
      - name: Download v0.4 production validation predictions
        run: |
          mkdir -p /tmp/v04
          gh release download i2-v0.4-production-validation-v1 -p '*.tar.gz' -D /tmp/v04
          mkdir -p /tmp/v04/ex
          tar -xzf /tmp/v04/*.tar.gz -C /tmp/v04/ex
      - name: Compute historical actual vs predicted exact-run overlay
        run: |
          python -m pip install --quiet pandas numpy pyarrow
          python src/analysis/i2_historical_exact_overlay.py --phase1 /tmp/phase1/ex --validation /tmp/v04/ex --out /tmp/overlay
      - name: Upload overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2-historical-exact-overlay
          path: /tmp/overlay/
