name: Run I2 postmortem

on:
  schedule:
    - cron: '30 10 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_postmortem.yml'
      - 'src/analysis/i2_postmortem_today.mjs'
      - 'src/analysis/i2_forecast_availability.mjs'
      - 'src/analysis/i2_rotowire_accuracy_season.mjs'
      - 'tests/i2_postmortem.test.mjs'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD (default: yesterday UTC)'
        required: false
      require_forecast:
        description: 'Fail if the requested frozen prediction is missing'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: i2-postmortem-main
  cancel-in-progress: false

jobs:
  postmortem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test tests/i2_postmortem.test.mjs
      - name: Resolve date
        id: params
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -z "$DATE_INPUT" ]; then DATE_INPUT="$(date -u -d 'yesterday' +%F)"; fi
          [[ "$DATE_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          echo "date=$DATE_INPUT" >> "$GITHUB_OUTPUT"
          echo "year=${DATE_INPUT:0:4}" >> "$GITHUB_OUTPUT"
      - name: Run postmortem
        id: daily
        env:
          GITHUB_TOKEN: ${{ github.token }}
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_FORECAST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_forecast && 'required' || 'auto' }}
        run: node src/analysis/i2_postmortem_today.mjs
      - name: Roll up RotoWire provisional accuracy
        id: season
        if: ${{ !cancelled() && steps.params.outcome == 'success' }}
        env:
          I2_YEAR: ${{ steps.params.outputs.year }}
        run: node src/analysis/i2_rotowire_accuracy_season.mjs
      - name: Commit verified reports
        if: ${{ !cancelled() && steps.season.outcome == 'success' }}
        env:
          DATE: ${{ steps.params.outputs.date }}
          YEAR: ${{ steps.params.outputs.year }}
          DAILY_OK: ${{ steps.daily.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ACC="data/derived/i2/rotowire_provisional_accuracy_${YEAR}.json"
          FILE="data/runtime/i2/${DATE}_postmortem.json"
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add "$ACC"
          if [ "$DAILY_OK" = true ] && [ -f "$FILE" ]; then git add "$FILE"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Postmortem I2 reporting ${DATE}"
          # Never reset/regenerate predictions. A concurrent main update fails visibly;
          # rerun reporting against the new checkout instead of overwriting reports.
          git push origin HEAD:main
