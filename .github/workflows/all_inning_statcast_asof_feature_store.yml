name: All-inning Statcast as-of feature store
on:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - src/ingestion/build_all_inning_statcast_asof_features.py
      - .github/workflows/all_inning_statcast_asof_feature_store.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33504099403
          pattern: all-inning-statcast-202[1-4]
          path: /tmp/statcast
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33450762451
          name: all-inning-m1-pa-matchup-development-2021-2024
          path: /tmp/m1
      - name: Build as-of features
        run: python src/ingestion/build_all_inning_statcast_asof_features.py --statcast-root /tmp/statcast --m1-matrix /tmp/m1/m1_pa_matchup_development.parquet --output-dir /tmp/asof
      - name: Governance audit
        run: |
          python - <<'PY'
          import json,pandas as pd
          j=json.load(open('/tmp/asof/manifest.json'))
          b=pd.read_parquet('/tmp/asof/statcast_batter_asof.parquet')
          p=pd.read_parquet('/tmp/asof/statcast_pitcher_asof.parquet')
          assert j['status']=='PASS' and j['development_seasons']==[2021,2022,2023,2024]
          assert j['holdout_opened'] is False and j['market_data_used'] is False
          assert j['same_day_history_included'] is False and j['shrinkage_applied'] is False
          assert len(b)>0 and len(p)>0
          assert pd.to_datetime(b.game_date).dt.year.max()<=2024
          assert pd.to_datetime(p.game_date).dt.year.max()<=2024
          print(j['candidate_families'],len(b),len(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-inning-statcast-asof-features-2021-2024
          path: /tmp/asof/
          retention-days: 30
