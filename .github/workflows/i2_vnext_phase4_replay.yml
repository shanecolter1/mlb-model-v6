name: I2 vNext Phase 4 - 2025 full replay

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase4_replay.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: i2-vnext-phase4-replay
  cancel-in-progress: true

jobs:
  replay-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated baseball data
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-data-phase
          path: data/derived/i2_vnext
          run-id: 36277324211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore validated 2025 replay inputs
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-replay-inputs
          path: data/derived/i2_vnext
          run-id: 36277324211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore frozen PA model
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-frozen-pa-model
          path: data/derived/i2_vnext
          run-id: 36277324211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore validated point-in-time models
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-walkforward-2025
          path: data/derived/i2_vnext/walkforward_2025
          run-id: 36277324211
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight restored artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inp=json.loads(Path('data/derived/i2_vnext/replay_2025_inputs.json').read_text())
          assert inp['market_inputs_used'] is False
          assert inp['season']==2025
          assert inp['i1_state_model']['player_specific_i1_talent_used'] is True
          assert inp['i1_player_asof_model']['hitter_prior_strength_pa']==100
          assert inp['i1_player_asof_model']['pitcher_prior_strength_bf']==180

          root=Path('data/derived/i2_vnext/walkforward_2025')
          wf=json.loads((root/'manifest.json').read_text())
          assert wf['market_inputs_used'] is False
          assert wf['cadence']=='monthly'
          assert len(wf['entries'])==6
          assert wf['entries'][0]['model_file']=='model_end_2024_frozen.json'
          assert len({e['model_file'] for e in wf['entries']})==6
          for e in wf['entries']:
              a=json.loads((root/e['model_file']).read_text())
              end=a.get('training',{}).get('end')
              assert a['market_inputs_used'] is False
              assert end and end < e['training_cutoff_exclusive'], (e,end)

          print({
              'games':inp['games_eligible'],
              'i1_mode':'player_asof',
              'walkforward_models':len(wf['entries'])
          })
          PY
          node --check src/research/run_i2_vnext_replay.mjs

      - name: Run untouched 2025 full-I2 replay
        run: |
          node src/research/run_i2_vnext_replay.mjs \
            --trials 2500 \
            --i1-mode player_asof \
            --input data/derived/i2_vnext/replay_2025_inputs.json \
            --model data/derived/i2_vnext/i2_vnext_event_model.json \
            --walkforward-manifest data/derived/i2_vnext/walkforward_2025/manifest.json \
            --arsenal data/derived/i2_vnext/arsenal_profile_2024.json \
            --parks data/derived/i2_vnext/park/savant_venue_profiles_2024_3yr.json \
            --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json \
            --output data/derived/i2_vnext/replay_2025_predictions.json

      - name: Verify replay and checkpoint metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m=json.loads(Path('data/derived/i2_vnext/replay_2025_predictions.json').read_text())
          assert m['season']==2025
          assert m['market_inputs_used'] is False
          assert m['observed_i2_state_used_as_predictor'] is False
          assert m['point_in_time_player_refits'] is True
          assert m['walkforward_policy']['point_in_time'] is True
          assert m['i1_state_mode']=='player_asof'
          assert m['i1_state_model']['player_specific_i1_talent_used'] is True
          assert m['n']>=2000

          checkpoint={
              'version':'i2-vnext-phase4-replay-checkpoint-v2',
              'source_artifact_run':36277324211,
              'season':2025,
              'market_inputs_used':False,
              'n':m['n'],
              'raw_brier':m['raw_brier'],
              'raw_logloss':m['raw_logloss'],
              'park_match_rate':m['park_match_rate'],
              'trials_per_game':m['trials_per_game'],
              'i1_state_mode':m['i1_state_mode'],
              'point_in_time_player_refits':m['point_in_time_player_refits'],
              'walkforward_cadence':m['walkforward_policy']['cadence'],
          }
          Path('data/derived/i2_vnext/phase4_replay_checkpoint.json').write_text(
              json.dumps(checkpoint,indent=2)
          )
          print(json.dumps(checkpoint,indent=2))
          PY

      - name: Upload durable phase 4 replay
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase4-replay-2025
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/replay_2025_predictions.json
            data/derived/i2_vnext/phase4_replay_checkpoint.json

      - name: Commit compact phase 4 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/phase4_replay_checkpoint.json
          if git diff --cached --quiet; then
            echo "No phase 4 checkpoint change"
          else
            git commit -m "research: checkpoint I2 vNext 2025 full replay"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
