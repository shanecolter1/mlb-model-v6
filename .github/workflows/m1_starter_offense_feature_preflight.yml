name: M1 starter offense feature preflight

on:
  push:
    branches:
      - research/baseball-asof-feature-store-build
    paths:
      - src/analysis/build_m1_starter_offense_matrix.py
      - src/analysis/m1_starter_offense_research.py
      - config/m1_starter_offense_feature_registry.csv
      - .github/workflows/m1_starter_offense_feature_preflight.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download reusable leakage-safe feature store
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33336358517
          name: reusable-baseball-asof-2021-2025
          path: /tmp/reusable
      - name: Audit raw M1 source feature coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          base=Path('/tmp/reusable')
          def one(name):
              hits=list(base.rglob(name)); assert len(hits)==1,{name:[str(x) for x in hits]}; return hits[0]
          ent=pd.read_parquet(one('entity_asof.parquet'))
          team=pd.read_parquet(one('team_asof.parquet'))
          st=pd.read_parquet(one('starter_asof.parquet'))
          gi=pd.read_parquet(one('game_index.parquet'))
          p=ent[ent['entity_type']=='pitcher'].copy(); b=team[team['team_role']=='batting'].copy()
          candidates={
            'k':['365d_ev_strikeout_rate_raw','365d_ev_strikeout_rate_shrunk','season_ev_strikeout_rate_raw','season_ev_strikeout_rate_shrunk'],
            'bb':['365d_ev_walk_rate_raw','365d_ev_walk_rate_shrunk','season_ev_walk_rate_raw','season_ev_walk_rate_shrunk'],
            'hr':['365d_ev_home_run_rate_raw','365d_ev_home_run_rate_shrunk','season_ev_home_run_rate_raw','season_ev_home_run_rate_shrunk'],
            'hit':['365d_ev_hit_rate_raw','365d_ev_hit_rate_shrunk','season_ev_hit_rate_raw','season_ev_hit_rate_shrunk']}
          def pick(df,cands):
              return next((c for c in cands if c in df.columns),None)
          src_p={k:pick(p,v) for k,v in candidates.items()}; src_b={k:pick(b,v) for k,v in candidates.items()}
          assert all(src_p.values()),src_p; assert all(src_b.values()),src_b
          pcov={k:float(pd.to_numeric(p[c],errors='coerce').notna().mean()) for k,c in src_p.items()}; bcov={k:float(pd.to_numeric(b[c],errors='coerce').notna().mean()) for k,c in src_b.items()}
          assert len(gi)>=12000; assert len(st)>=24000
          out={'games':len(gi),'starter_rows':len(st),'pitcher_asof_rows':len(p),'batting_team_asof_rows':len(b),'pitcher_source_columns':src_p,'offense_source_columns':src_b,'pitcher_nonnull_coverage':pcov,'offense_nonnull_coverage':bcov,'strict_cutoff':'source_event_date < target_game_date','same_day_prior_games_included':False,'status':'PASS'}
          Path('/tmp/m1_preflight.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m1-starter-offense-feature-preflight
          path: /tmp/m1_preflight.json
          retention-days: 30
