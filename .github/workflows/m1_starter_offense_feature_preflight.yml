name: M1 starter offense feature preflight

on:
  push:
    branches:
      - research/baseball-asof-feature-store-build
    paths:
      - src/analysis/build_m1_starter_offense_matrix.py
      - src/analysis/m1_starter_offense_research.py
      - config/m1_starter_offense_feature_registry.csv
      - .github/workflows/m1_starter_offense_feature_preflight.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Download reusable leakage-safe feature store
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33336358517
          name: reusable-baseball-asof-2021-2025
          path: /tmp/reusable

      - name: Audit M1 source feature coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/reusable')
          print('FILES', sorted(p.name for p in root.iterdir()))
          st=pd.read_parquet(root/'starter_asof.parquet')
          tg=pd.read_parquet(root/'game_team_asof.parquet')
          gi=pd.read_parquet(root/'game_index.parquet')
          def pick(df,cands):
              for c in cands:
                  if c in df.columns:return c
              return None
          candidates={
            'k':['365d_ev_strikeout_rate_shrunk','365d_strikeout_rate_shrunk','season_ev_strikeout_rate_shrunk'],
            'bb':['365d_ev_walk_rate_shrunk','365d_walk_rate_shrunk','season_ev_walk_rate_shrunk'],
            'hr':['365d_ev_home_run_rate_shrunk','365d_home_run_rate_shrunk','season_ev_home_run_rate_shrunk'],
            'hit':['365d_ev_hit_rate_shrunk','365d_hit_rate_shrunk','season_ev_hit_rate_shrunk'],
          }
          src_st={k:pick(st,v) for k,v in candidates.items()}
          src_tg={k:pick(tg,v) for k,v in candidates.items()}
          assert all(src_st.values()), src_st
          assert all(src_tg.values()), src_tg
          st_coverage={k:float(pd.to_numeric(st[c],errors='coerce').notna().mean()) for k,c in src_st.items()}
          tg_coverage={k:float(pd.to_numeric(tg[c],errors='coerce').notna().mean()) for k,c in src_tg.items()}
          assert (st['statistics_timing_class']=='asof_safe_strictly_prior_date').all()
          assert (tg['statistics_timing_class']=='asof_safe_strictly_prior_date').all()
          out={
            'games':len(gi),'starter_rows':len(st),'team_game_rows':len(tg),
            'starter_source_columns':src_st,'offense_source_columns':src_tg,
            'starter_nonnull_coverage':st_coverage,'offense_nonnull_coverage':tg_coverage,
            'statistics_timing_class':'asof_safe_strictly_prior_date',
            'status':'PASS'
          }
          Path('/tmp/m1_preflight.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: m1-starter-offense-feature-preflight
          path: /tmp/m1_preflight.json
          retention-days: 30
