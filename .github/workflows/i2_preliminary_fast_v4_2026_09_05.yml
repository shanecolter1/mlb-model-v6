name: I2 preliminary fast v4 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_preliminary_fast_v4_2026_09_05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preliminary-v4:
    runs-on: ubuntu-latest
    env:
      DATE: '2026-09-05'
      CUTOFF: '2026-09-05T16:00:00Z'
      MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
      SPORTSBOOK_DATA_SOURCE: THE_ODDS_API
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SAMPLE_COUNT: '6'
      I2_TRIALS: '10000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate probabilistic preliminary lineups from recent MLB batting orders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,urllib.parse,datetime,math,random,os
          from collections import defaultdict
          D=os.environ['DATE'];N=int(os.environ['SAMPLE_COUNT']);target=datetime.date.fromisoformat(D);random.seed(9052026)
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'MLB-I2-Prelim-v4/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          def sched(**p):return get('https://statsapi.mlb.com/api/v1/schedule?'+urllib.parse.urlencode(p))
          games=[g for d in sched(sportId=1,date=D,hydrate='probablePitcher,team').get('dates',[]) for g in d.get('games',[])]
          def hand(pid):
              if not pid:return None
              return ((get(f'https://statsapi.mlb.com/api/v1/people/{pid}').get('people',[{}])[0].get('pitchHand') or {}).get('code'))
          def roster(tid):return {int(x['person']['id']):x['person']['fullName'] for x in get(f'https://statsapi.mlb.com/api/v1/teams/{tid}/roster?rosterType=active&date={D}').get('roster',[]) if x.get('person',{}).get('id')}
          def history(tid,active,target_hand):
              gs=[g for d in sched(sportId=1,teamId=tid,startDate=(target-datetime.timedelta(days=10)).isoformat(),endDate=(target-datetime.timedelta(days=1)).isoformat(),gameType='R').get('dates',[]) for g in d.get('games',[])];gs.sort(key=lambda x:x.get('gameDate',''),reverse=True);gs=gs[:6]
              ss=defaultdict(lambda:defaultdict(float));ov=defaultdict(float);audit=[]
              for idx,g in enumerate(gs):
                  try:f=get(f"https://statsapi.mlb.com/api/v1.1/game/{g['gamePk']}/feed/live")
                  except:continue
                  gd=f.get('gameData',{});bx=f.get('liveData',{}).get('boxscore',{}).get('teams',{});side='home' if (gd.get('teams',{}).get('home') or {}).get('id')==tid else 'away';opp='away' if side=='home' else 'home';bo=[int(x) for x in ((bx.get(side,{}) or {}).get('battingOrder') or []) if x]
                  if len(bo)!=9:continue
                  op=(bx.get(opp,{}) or {}).get('pitchers') or [];oh=((gd.get('players',{}).get(f'ID{op[0]}',{}) or {}).get('pitchHand') or {}).get('code') if op else None
                  w=math.exp(-0.35*idx)*(1.8 if target_hand and oh==target_hand else 1.0);kept=0
                  for sl,pid in enumerate(bo,1):
                      if pid in active:ss[pid][sl]+=w;ov[pid]+=w;kept+=1
                  audit.append({'gamePk':g['gamePk'],'oppHand':oh,'weight':round(w,4),'activePlayersKept':kept})
              return ss,ov,audit
          teams={};meta={}
          for g in games:
              gp=str(g['gamePk']);a=g['teams']['away']['team'];h=g['teams']['home']['team'];ap=g['teams']['away'].get('probablePitcher') or {};hp=g['teams']['home'].get('probablePitcher') or {};ah=hand(ap.get('id'));hh=hand(hp.get('id'));meta[gp]={'away':a,'home':h,'awayStarter':ap,'homeStarter':hp,'awayStarterHand':ah,'homeStarterHand':hh,'gameDate':g.get('gameDate')}
              for t,opp_h in ((a,hh),(h,ah)):
                  tid=int(t['id'])
                  if tid not in teams:
                      act=roster(tid);ss,ov,aud=history(tid,act,opp_h);teams[tid]={'team':t,'active':act,'ss':ss,'ov':ov,'audit':aud,'oppHand':opp_h}
          def pick(items,w):
              total=sum(w)
              if total<=0:return random.choice(items)
              r=random.random()*total;c=0
              for x,z in zip(items,w):
                  c+=z
                  if c>=r:return x
              return items[-1]
          def lineup(t):
              elig=[p for p,v in t['ov'].items() if p in t['active'] and v>0]
              if len(elig)<9:raise RuntimeError(f"{t['team']['name']} only {len(elig)} active recent hitters")
              used=set();out=[]
              for sl in range(1,10):
                  cand=[p for p in elig if p not in used];weights=[t['ss'][p].get(sl,0)+.05*t['ov'][p] for p in cand];p=pick(cand,weights);used.add(p);out.append(t['active'][p])
              return out
          os.makedirs(f'data/runtime/i2/{D}_prelim_v4_overrides',exist_ok=True)
          for n in range(1,N+1):
              o={'governance':{'sourceStatus':'PRELIMINARY_PROBABILISTIC_MLB_HISTORY','note':'Recent official MLB 9-slot batting orders, exact-date active roster, recency and opposing starter hand weighted. Shadow only.'},'games':{}}
              for gp,m in meta.items():o['games'][gp]={'matchup':f"{m['away']['name']} @ {m['home']['name']}",'away':lineup(teams[int(m['away']['id'])]),'home':lineup(teams[int(m['home']['id'])])}
              json.dump(o,open(f'data/runtime/i2/{D}_prelim_v4_overrides/sample_{n:02d}.json','w'),indent=2)
          json.dump({'date':D,'source':'Official MLB Stats API','method':'last 6 completed-game battingOrder arrays + active roster + recency + starter-handedness weighting','games':meta,'teams':{str(k):{'team':v['team'],'oppHand':v['oppHand'],'history':v['audit'],'eligibleHitters':len(v['ov'])} for k,v in teams.items()}},open(f'data/runtime/i2/{D}_prelim_v4_lineup_audit.json','w'),indent=2)
          print(json.dumps({'games':len(games),'teams':len(teams)},indent=2))
          PY

      - name: Capture approved run environment
        env:
          I2_DATE: ${{ env.DATE }}
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ env.DATE }}_prelim_v4_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
        run: node src/pipeline/fetch_i2_run_environment.mjs

      - name: Run preliminary lineup samples through I2 engine
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 "$SAMPLE_COUNT"); do
            i=$(printf '%02d' "$n")
            echo "sample $i/$SAMPLE_COUNT"
            I2_DATE="$DATE" I2_CUTOFF="$CUTOFF" I2_TRIALS="$I2_TRIALS" \
            I2_OUTPUT="data/runtime/i2/${DATE}_prelim_v4_sample_${i}.json" \
            I2_LINEUP_OVERRIDES="data/runtime/i2/${DATE}_prelim_v4_overrides/sample_${i}.json" \
            I2_RUN_ENVIRONMENT="data/runtime/i2/${DATE}_prelim_v4_run_environment.json" \
            I2_TOTAL_PRIOR="data/derived/i2/i2_total_conditioned_prior.json" \
            I2_VENUE_PROFILES="data/runtime/i2/savant_venue_profiles_2026_3yr.json" \
            node src/pipeline/run_i2_total_conditioned.mjs
          done

      - name: Aggregate preliminary I2 board
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,statistics,os
          D=os.environ['DATE'];by={}
          for fn in sorted(glob.glob(f'data/runtime/i2/{D}_prelim_v4_sample_*.json')):
              p=json.load(open(fn))
              for g in p.get('games',[]):
                  if g.get('runEnvironmentConditioned'):by.setdefault(str(g['gamePk']),[]).append(g)
          def am(p):
              if not 0<p<1:return None
              return round(-100*p/(1-p)) if p>=.5 else round(100*(1-p)/p)
          out=[]
          for gp,a in by.items():
              u=[float(x['under05']) for x in a];m=sum(u)/len(u);b=a[0];ex={k:round(sum(float(x.get('fullI2Exact',{}).get(k,0)) for x in a)/len(a),2) for k in ['0','1','2','3','4+']}
              out.append({'gamePk':int(gp),'matchup':f"{b['away']} @ {b['home']}",'gameDate':b.get('gameDate'),'samples':len(a),'under05Pct':round(100*m,2),'over05Pct':round(100*(1-m),2),'fairUnder':am(m),'fairOver':am(1-m),'lineupUncertaintySdPct':round(100*(statistics.pstdev(u) if len(u)>1 else 0),2),'underRangePct':[round(100*min(u),2),round(100*max(u),2)],'top2ScorePct':round(sum(float(x['top2ScorePct']) for x in a)/len(a),2),'bottom2ScorePct':round(sum(float(x['bottom2ScorePct']) for x in a)/len(a),2),'fullI2Exact':ex,'runEnvironment':b.get('runEnvironment'),'predictionClass':'PRELIMINARY_PROBABILISTIC_LINEUP_SHADOW'})
          out.sort(key=lambda x:x['under05Pct'],reverse=True)
          for i,g in enumerate(out,1):g['rank']=i
          payload={'date':D,'status':'PRELIMINARY_SHADOW_NOT_BETTING_APPROVED','cutoff':os.environ['CUTOFF'],'lineupMethod':'probabilistic recent official MLB batting orders','projectedGames':len(out),'games':out,'governance':{'confirmedLineupsRequiredForOfficial':True,'derivativeMarketDataUsed':False,'fullGameTotalPointConditioningUsed':True}}
          json.dump(payload,open(f'data/runtime/i2/{D}_preliminary_probabilistic_projection_v4.json','w'),indent=2)
          print(json.dumps({'projectedGames':len(out),'ranking':[{'rank':g['rank'],'matchup':g['matchup'],'under':g['under05Pct'],'over':g['over05Pct'],'fairUnder':g['fairUnder'],'sd':g['lineupUncertaintySdPct'],'range':g['underRangePct'],'total':g['runEnvironment'].get('fullGameTotal')} for g in out]},indent=2))
          PY

      - name: Commit board
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/i2/${DATE}_preliminary_probabilistic_projection_v4.json data/runtime/i2/${DATE}_prelim_v4_lineup_audit.json data/runtime/i2/${DATE}_prelim_v4_run_environment.json
          git commit -m "Add preliminary probabilistic I2 board v4 ${DATE}" || exit 0
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
