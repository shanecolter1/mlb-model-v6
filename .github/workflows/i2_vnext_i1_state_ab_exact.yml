name: I2 vNext exact I1 state A-B

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_i1_state_ab_exact.yml'

permissions:
  contents: write
  actions: read

jobs:
  exact-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install comparison dependency
        run: python -m pip install --upgrade pip numpy

      - name: Restore frozen 2023-24 I2 model
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-frozen-pa-model
          path: data/derived/i2_vnext
          run-id: 36273567216
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore 2025 replay inputs
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-replay-inputs
          path: data/derived/i2_vnext
          run-id: 36273567216
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore park profile
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-data-phase
          path: data/derived/i2_vnext
          run-id: 36273567216
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download 2025 Retrosheet source
        run: |
          mkdir -p data/raw/i2_vnext/retrosheet
          curl --fail --location --retry 3 \
            "https://www.retrosheet.org/downloads/plays/2025plays.zip" \
            --output data/raw/i2_vnext/retrosheet/2025plays.zip

      - name: Attach point-in-time I1 player rates
        run: |
          python src/research/attach_i1_player_asof_rates.py \
            --input data/derived/i2_vnext/replay_2025_inputs.json \
            --retrosheet-zip data/raw/i2_vnext/retrosheet/2025plays.zip \
            --output data/derived/i2_vnext/replay_2025_inputs_i1_ab.json

      - name: Syntax check
        run: |
          node --check src/research/run_i2_i1_state_ab_exact.mjs
          python -m py_compile src/research/attach_i1_player_asof_rates.py src/research/compare_i1_state_ab_exact.py

      - name: Run exact full-I2 A-B
        run: |
          node src/research/run_i2_i1_state_ab_exact.mjs \
            --input data/derived/i2_vnext/replay_2025_inputs_i1_ab.json \
            --model data/derived/i2_vnext/i2_vnext_event_model.json \
            --arsenal data/derived/i2_vnext/arsenal_profile_2024.json \
            --parks data/derived/i2_vnext/park/savant_venue_profiles_2024_3yr.json \
            --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json \
            --output data/derived/i2_vnext/i1_state_ab_exact_predictions.json

      - name: Paired statistical comparison
        run: |
          python src/research/compare_i1_state_ab_exact.py \
            --input data/derived/i2_vnext/i1_state_ab_exact_predictions.json \
            --output data/derived/i2_vnext/i1_state_ab_2025_exact.json

      - name: Verify result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/derived/i2_vnext/i1_state_ab_2025_exact.json').read_text())
          assert p['market_inputs_used'] is False
          assert p['games'] >= 2000
          assert p['verdict'] in {
              'PLAYER_ASOF_PASS','LEAGUE_AVERAGE_PASS',
              'PLAYER_ASOF_DIRECTIONAL_ONLY','LEAGUE_AVERAGE_OR_NO_CLEAR_GAIN'
          }
          print(json.dumps(p,indent=2))
          PY

      - name: Upload exact A-B checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-i1-state-ab-exact-2025
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/i1_state_ab_2025_exact.json
            data/derived/i2_vnext/i1_state_ab_exact_predictions.json

      - name: Commit compact exact A-B result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/i1_state_ab_2025_exact.json
          if git diff --cached --quiet; then
            echo "No exact A-B result change"
          else
            git commit -m "research: checkpoint exact I1 state A-B"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
