name: I2 vNext bounded research build

on:
  workflow_dispatch:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_build.yml'
      - 'src/research/build_i2_vnext_statcast.py'
      - 'src/research/fit_i2_vnext.py'
      - 'src/research/build_i2_vnext_replay_inputs.py'
      - 'src/research/run_i2_vnext_replay.mjs'
      - 'src/research/calibrate_i2_vnext_full.py'
      - 'src/model/i2_vnext_event_model.js'
      - 'src/model/i2_inning_model.js'
      - 'src/event_probability_engine.js'
      - 'docs/I2_VNEXT_DIRECT_TALENT_SPEC.md'

permissions:
  contents: write

concurrency:
  group: i2-vnext-direct-talent-build
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore bounded Statcast cache
        uses: actions/cache@v4
        with:
          path: data/cache/i2_vnext/statcast
          key: i2-vnext-statcast-2023-2026-v3

      - name: Install bounded data dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Build inning-2-only Statcast dataset
        run: |
          python src/research/build_i2_vnext_statcast.py \
            --start 2023-03-01 \
            --end 2026-09-25 \
            --sleep 0.20

      - name: Verify dataset governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/derived/i2_vnext/dataset_manifest.json').read_text())
          assert m['market_inputs_used'] is False
          assert m['start'].startswith('2023-')
          assert m['end']=='2026-09-25'
          assert m['rows'] > 0
          print({'rows':m['rows'],'games':m['games'],'batters':m['batters'],'pitchers':m['pitchers']})
          PY

      - name: Persist phase 1 data
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-data-phase
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/dataset_manifest.json
            data/derived/i2_vnext/i2_pa_statcast.csv
            data/derived/i2_vnext/arsenal/

  fit-model:
    needs: build-data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install model dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn

      - name: Restore phase 1 data
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-data-phase
          path: data/derived/i2_vnext

      - name: Fit frozen evaluation model and fixed-spec live refit
        run: |
          python src/research/fit_i2_vnext.py \
            --half-lives 180,365,730,1460 \
            --c-grid 0.05,0.2,1.0

      - name: Verify holdout isolation and artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('data/derived/i2_vnext/i2_vnext_event_model.json').read_text())
          live=json.loads(Path('data/derived/i2_vnext/i2_vnext_event_model_live.json').read_text())
          h=frozen['holdout_policy']
          assert h['fit_uses_2025'] is False
          assert h['fit_uses_2026'] is False
          assert h['full_i2_calibration_year'] == 2025
          assert h['prospective_validation_start'] == '2026-09-26'
          assert frozen['artifact_role'] == 'FROZEN_HOLDOUT_EVALUATION'
          assert live['artifact_role'] == 'LIVE_REFIT_FIXED_SPECIFICATION'
          assert frozen['market_inputs_used'] is False
          assert live['market_inputs_used'] is False
          print({'frozen_training':frozen['training'],'live_training':live['training'],'selected':frozen['selected']})
          PY
          node --check src/model/i2_vnext_event_model.js
          node --check src/model/i2_inning_model.js
          node --check src/event_probability_engine.js

      - name: Persist phase 2 models
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-model-phase
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/i2_vnext_event_model.json
            data/derived/i2_vnext/i2_vnext_event_model_live.json
            data/derived/i2_vnext/live_arsenal_profile.json
            data/derived/i2_vnext/arsenal_profile_2024.json

  replay-and-calibrate:
    needs: [build-data, fit-model]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install replay dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn requests lxml

      - name: Restore phase 1 data
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-data-phase
          path: data/derived/i2_vnext

      - name: Restore phase 2 models
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-model-phase
          path: data/derived/i2_vnext

      - name: Download bounded 2024/2025 replay sources
        run: |
          python - <<'PY'
          import requests
          from pathlib import Path
          for year in (2024,2025):
              url=f'https://www.retrosheet.org/downloads/plays/{year}plays.zip'
              r=requests.get(url,timeout=120,headers={'User-Agent':'MLB-I2-vNext/1.0'})
              r.raise_for_status()
              Path(f'/tmp/{year}plays.zip').write_bytes(r.content)
          PY
          git clone --depth 1 https://github.com/chadwickbureau/register.git /tmp/chadwick-register

      - name: Build leakage-safe 2025 pregame replay inputs
        run: |
          python src/research/build_i2_vnext_replay_inputs.py \
            --season 2025 \
            --retrosheet-zip /tmp/2025plays.zip \
            --prior-retrosheet-zip /tmp/2024plays.zip \
            --chadwick-dir /tmp/chadwick-register/data \
            --output data/derived/i2_vnext/replay_2025_inputs.json

      - name: Build prior-season Savant park profiles
        run: |
          mkdir -p data/derived/i2_vnext/park
          python src/build_savant_venue_profiles.py \
            --year 2024 \
            --rolling 3 \
            --output-dir data/derived/i2_vnext/park

      - name: Run full-model 2025 replay
        run: |
          node src/research/run_i2_vnext_replay.mjs \
            --input data/derived/i2_vnext/replay_2025_inputs.json \
            --model data/derived/i2_vnext/i2_vnext_event_model.json \
            --arsenal data/derived/i2_vnext/arsenal_profile_2024.json \
            --parks data/derived/i2_vnext/park/savant_venue_profiles_2024_3yr.json \
            --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json \
            --output data/derived/i2_vnext/replay_2025_predictions.json \
            --trials 2500

      - name: Fit exactly one final full-I2 calibration layer
        run: |
          python src/research/calibrate_i2_vnext_full.py \
            --replay data/derived/i2_vnext/replay_2025_predictions.json \
            --output data/derived/i2_vnext/i2_vnext_full_calibration.json

      - name: Verify final model governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          replay=json.loads(Path('data/derived/i2_vnext/replay_2025_predictions.json').read_text())
          cal=json.loads(Path('data/derived/i2_vnext/i2_vnext_full_calibration.json').read_text())
          assert replay['market_inputs_used'] is False
          assert replay['observed_i2_state_used_as_predictor'] is False
          assert cal['market_inputs_used'] is False
          assert cal['final_curve']['type'] in ('none','sigmoid')
          assert cal['governance']['component_level_probability_calibration'] is False
          print(json.dumps({
            'replay_games':replay['n'],
            'raw_brier':replay['raw_brier'],
            'raw_logloss':replay['raw_logloss'],
            'park_match_rate':replay['park_match_rate'],
            'calibration_selection':cal['calibration_selection'],
            'final_curve':cal['final_curve']
          }, indent=2))
          PY
          node --check src/pipeline/run_i2_vnext_today.mjs

      - name: Commit compact production-candidate artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/derived/i2_vnext/dataset_manifest.json \
            data/derived/i2_vnext/i2_vnext_event_model.json \
            data/derived/i2_vnext/i2_vnext_event_model_live.json \
            data/derived/i2_vnext/live_arsenal_profile.json \
            data/derived/i2_vnext/arsenal_profile_2024.json \
            data/derived/i2_vnext/i2_vnext_full_calibration.json
          if git diff --cached --quiet; then
            echo "No compact artifact changes"
          else
            git commit -m "research: fit I2 vNext production-candidate artifacts"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi

      - name: Upload replay diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i2-vnext-replay-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/derived/i2_vnext/replay_2025_inputs.json
            data/derived/i2_vnext/replay_2025_predictions.json
            data/derived/i2_vnext/i2_vnext_full_calibration.json
