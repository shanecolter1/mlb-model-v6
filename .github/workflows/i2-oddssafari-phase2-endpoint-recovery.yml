name: I2 OddsSafari Phase 2 Endpoint Recovery
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
    paths:
      - '.github/workflows/i2-oddssafari-phase2-endpoint-recovery.yml'
      - 'analysis/oddssafari_phase2_endpoint_trigger.txt'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/i2-weekday-edge-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover match-page endpoints and embedded state
        run: |
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          html_path=Path('analysis_outputs/oddssafari_phase2_page.html')
          html=html_path.read_text(encoding='utf-8',errors='ignore') if html_path.exists() else ''
          out=[]

          # Parse __NEXT_DATA__ / script references from saved page.
          soup=BeautifulSoup(html,'html.parser') if html else None
          if soup:
              nd=soup.find('script',id='__NEXT_DATA__')
              if nd and nd.string:
                  try:
                      data=json.loads(nd.string)
                      out.append('NEXT_DATA_JSON')
                      out.append(json.dumps(data,indent=2)[:120000])
                  except Exception as e:
                      out.append('NEXT_DATA_PARSE_ERROR='+repr(e))
              scripts=[]
              for s in soup.find_all('script',src=True):
                  src=s.get('src')
                  if src and ('matches/' in src or 'chunks/' in src): scripts.append(src)
          else:
              scripts=[]

          # Ensure current match bundle is included.
          explicit='/_next/static/chunks/pages/matches/%5B...slug%5D-b61381e56a978059.js'
          if explicit not in scripts: scripts.append(explicit)

          needles=re.compile(r'(?i)(/api/[^"\'`\\\s]+|https?://[^"\'`\\\s]+|[^"\'`]{0,90}(?:market|odds|history|period|event|match|spread|handicap)[^"\'`]{0,150})')
          urls=set(); snippets=set()
          for src in scripts:
              url=src if src.startswith('http') else 'https://www.oddssafari.com'+src
              try:
                  r=requests.get(url,timeout=30)
                  out.append(f'BUNDLE {url} STATUS {r.status_code} LEN {len(r.text)}')
                  if r.status_code!=200: continue
                  text=r.text
                  for m in needles.finditer(text):
                      val=m.group(0).strip()
                      if not val: continue
                      if val.startswith('/api/') or val.startswith('http'):
                          urls.add(val[:1000])
                      else:
                          snippets.add(val[:500])
              except Exception as e:
                  out.append(f'BUNDLE_ERROR {url} {e!r}')

          out.append('\nAPI_OR_URL_CANDIDATES')
          for x in sorted(urls): out.append(x)
          out.append('\nRELEVANT_CODE_SNIPPETS')
          for x in sorted(snippets): out.append(x)

          # Compact network-log URL inventory, excluding static assets.
          try:
              net=json.loads(Path('analysis_outputs/oddssafari_phase2_network.json').read_text())
              out.append('\nNONSTATIC_NETWORK_URLS')
              seen=set()
              for rec in net:
                  u=rec.get('url','')
                  if not u or '/_next/static/' in u or '/_next/image' in u or 'sentry.io' in u: continue
                  if u not in seen:
                      seen.add(u); out.append(f"{rec.get('method')} {rec.get('type')} {rec.get('status')} {u}")
          except Exception as e:
              out.append('NETWORK_PARSE_ERROR='+repr(e))

          Path('analysis_outputs/oddssafari_phase2_endpoint_summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[-300:]))
          PY
      - name: Save endpoint recovery output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_outputs/oddssafari_phase2_endpoint_summary.txt
          git commit -m "Save OddsSafari phase 2 endpoint recovery" || exit 0
          git push origin HEAD:analysis/i2-weekday-edge-20260906
