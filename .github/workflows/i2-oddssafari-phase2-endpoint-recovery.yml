name: I2 OddsSafari Phase 2 Endpoint Recovery
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
    paths:
      - '.github/workflows/i2-oddssafari-phase2-endpoint-recovery.yml'
      - 'analysis/oddssafari_phase2_endpoint_trigger.txt'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/i2-weekday-edge-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover match-page endpoints and embedded state
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          html_path=Path('analysis_outputs/oddssafari_phase2_page.html')
          html=html_path.read_text(encoding='utf-8',errors='ignore') if html_path.exists() else ''
          out=[]

          # Extract Next.js state directly from saved HTML.
          m=re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',html,re.S|re.I)
          if m:
              try:
                  data=json.loads(m.group(1))
                  out.append('NEXT_DATA_JSON')
                  out.append(json.dumps(data,indent=2)[:120000])
              except Exception as e:
                  out.append('NEXT_DATA_PARSE_ERROR='+repr(e))

          # Extract script references from saved HTML.
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              if 'matches/' in src or '/chunks/' in src:
                  scripts.append(src)
          explicit='/_next/static/chunks/pages/matches/%5B...slug%5D-b61381e56a978059.js'
          if explicit not in scripts: scripts.append(explicit)

          api_pat=re.compile(r'''(?i)(/api/[A-Za-z0-9_?=&%./{}:+,-]+|https?://[A-Za-z0-9_?=&%./{}:+,-]+)''')
          context_pat=re.compile(r'''(?i).{0,100}(?:market|odds|history|period|event|match|spread|handicap).{0,180}''')
          urls=set(); snippets=set()
          headers={'User-Agent':'Mozilla/5.0'}
          for src in scripts:
              url=src if src.startswith('http') else 'https://www.oddssafari.com'+src
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      text=resp.read().decode('utf-8','ignore')
                      status=resp.status
                  out.append(f'BUNDLE {url} STATUS {status} LEN {len(text)}')
                  for x in api_pat.findall(text): urls.add(x[:1200])
                  for x in context_pat.findall(text):
                      x=' '.join(x.split())
                      if x: snippets.add(x[:700])
              except Exception as e:
                  out.append(f'BUNDLE_ERROR {url} {e!r}')

          out.append('\nAPI_OR_URL_CANDIDATES')
          out.extend(sorted(urls))
          out.append('\nRELEVANT_CODE_SNIPPETS')
          out.extend(sorted(snippets))

          # Compact network-log URL inventory.
          try:
              net=json.loads(Path('analysis_outputs/oddssafari_phase2_network.json').read_text())
              out.append('\nNONSTATIC_NETWORK_URLS')
              seen=set()
              for rec in net:
                  u=rec.get('url','')
                  if not u or '/_next/static/' in u or '/_next/image' in u or 'sentry.io' in u: continue
                  if u not in seen:
                      seen.add(u)
                      out.append(f"{rec.get('method')} {rec.get('type')} {rec.get('status')} {u}")
          except Exception as e:
              out.append('NETWORK_PARSE_ERROR='+repr(e))

          Path('analysis_outputs/oddssafari_phase2_endpoint_summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[-400:]))
          PY
      - name: Save endpoint recovery output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis_outputs/oddssafari_phase2_endpoint_summary.txt
          git commit -m "Save OddsSafari phase 2 endpoint recovery" || exit 0
          git push origin HEAD:analysis/i2-weekday-edge-20260906
