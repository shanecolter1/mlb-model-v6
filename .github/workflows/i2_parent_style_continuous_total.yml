name: I2 parent-style continuous total experiment

on:
  push:
    branches:
      - research/i2-v0.4-local-cv-production
    paths:
      - 'src/analysis/i2_parent_style_continuous_total.py'
      - '.github/workflows/i2_parent_style_continuous_total.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen Phase 1 historical store
        run: |
          mkdir -p /tmp/phase1
          gh release download i2-phase1-historical-store-v1 -p 'i2-phase1-frozen-historical-store-2021-2025.tar.gz' -D /tmp/phase1
          mkdir -p /tmp/phase1/ex
          tar -xzf /tmp/phase1/i2-phase1-frozen-historical-store-2021-2025.tar.gz -C /tmp/phase1/ex
      - name: Download v0.4 validation predictions
        run: |
          mkdir -p /tmp/v04
          gh release download i2-v0.4-production-validation-v1 -p '*.tar.gz' -D /tmp/v04
          mkdir -p /tmp/v04/ex
          tar -xzf /tmp/v04/*.tar.gz -C /tmp/v04/ex
      - name: Rebuild reusable leakage-safe as-of store from frozen normalized inputs
        run: |
          python -m pip install --quiet pandas numpy pyarrow scipy scikit-learn
          PROC=$(dirname "$(find /tmp/phase1/ex -name plate_appearances.parquet | head -1)")
          echo "processed_dir=$PROC"
          test -f "$PROC/games.parquet"
          test -f "$PROC/lineups.parquet"
          test -f "$PROC/starters.parquet"
          test -f "$PROC/results.parquet"
          test -f "$PROC/inning_results.parquet"
          mkdir -p /tmp/reusable
          PYTHONPATH=. python src/ingestion/build_asof_entity_rates_fast.py --plate-appearances "$PROC/plate_appearances.parquet" --output /tmp/entity_asof.parquet --shrink-strength 50
          PYTHONPATH=. python src/ingestion/build_asof_team_rates_fast.py --plate-appearances "$PROC/plate_appearances.parquet" --output /tmp/team_asof.parquet --shrink-strength 200
          PYTHONPATH=. python src/ingestion/assemble_reusable_asof_store.py --processed-dir "$PROC" --entity-asof /tmp/entity_asof.parquet --team-asof /tmp/team_asof.parquet --output-dir /tmp/reusable
          python - <<'PY'
          import pandas as pd
          p='/tmp/reusable/inning_outcomes.parquet'
          d=pd.read_parquet(p)
          print('inning_outcomes columns:', list(d.columns))
          def pick(cands):
              for c in cands:
                  if c in d.columns: return c
              return None
          hc=pick(['home_runs_game','home_score_game','home_final_runs','home_score','home_runs'])
          ac=pick(['away_runs_game','away_score_game','away_final_runs','away_score','away_runs'])
          if hc is None or ac is None:
              raise SystemExit(f'Could not identify final score columns: home={hc} away={ac}')
          d['home_runs']=pd.to_numeric(d[hc],errors='coerce')
          d['away_runs']=pd.to_numeric(d[ac],errors='coerce')
          if 'total_runs' not in d.columns:
              d['total_runs']=d['home_runs']+d['away_runs']
          d.to_parquet(p,index=False)
          print('normalized final scores from',hc,ac)
          PY
      - name: Run parent-style experiment
        run: |
          PYTHONPATH=. python src/analysis/i2_parent_style_continuous_total.py --phase1 /tmp/reusable --v04 /tmp/v04/ex --out /tmp/out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2-parent-style-continuous-total
          path: /tmp/out/
