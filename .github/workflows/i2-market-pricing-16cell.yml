name: I2 Market Pricing 16-Cell
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
    paths:
      - '.github/workflows/i2-market-pricing-16cell.yml'
      - 'scripts/i2_market_pricing_16cell.py'
      - 'scripts/i2_export_cohort_ids.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/i2-weekday-edge-20260906
      - name: Download Retrosheet
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
      - name: Download canonical market master
        run: |
          set -euo pipefail
          curl -fL "https://github.com/shanecolter1/mlb-model-v6/releases/download/historical-mlb-2021-2025-v1/MLB_Game_Stats_Joined_2021_2025.csv.gz" -o /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz
          echo "8512a4fc2fc8e8566d62080bcf006ab6dbdc953e95c3eb8725b55c47a8dafee5  /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz" | sha256sum -c -
      - name: Reconstruct exact cohorts
        run: python scripts/i2_export_cohort_ids.py > /tmp/i2_cohort_output.txt
      - name: Join market pricing and calculate 16 cells
        run: python scripts/i2_market_pricing_16cell.py /tmp/i2_cohort_output.txt /tmp/MLB_Game_Stats_Joined_2021_2025.csv.gz
      - name: Display validation and results
        run: |
          cat analysis_outputs/i2_market_pricing_validation.txt
          cat analysis_outputs/i2_market_pricing_16cell.csv
          cat analysis_outputs/i2_market_pricing_game4_focus.csv
          cat analysis_outputs/i2_market_pricing_sunday_g4.csv
      - name: Commit exact result tables
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/i2_market_pricing_16cell.csv analysis_outputs/i2_market_pricing_game4_focus.csv analysis_outputs/i2_market_pricing_sunday_g4.csv analysis_outputs/i2_market_pricing_validation.txt
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Save exact I2 16-cell market pricing results"
            git push origin HEAD:analysis/i2-weekday-edge-20260906
          fi
