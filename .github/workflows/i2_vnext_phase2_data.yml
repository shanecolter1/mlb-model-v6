name: I2 vNext Phase 2 - historical dataset

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase2_data.yml'

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore bounded Statcast cache
        uses: actions/cache@v4
        with:
          path: data/cache/i2_vnext/statcast
          key: i2-vnext-statcast-2023-2026-v3

      - name: Install bounded dependencies
        run: python -m pip install --upgrade pip pandas requests

      - name: Build inning-2-only Statcast dataset
        run: |
          python src/research/build_i2_vnext_statcast.py \
            --start 2023-03-01 \
            --end 2026-09-25 \
            --sleep 0.20

      - name: Verify dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('data/derived/i2_vnext')
          manifest=json.loads((root/'dataset_manifest.json').read_text())
          df=pd.read_csv(root/'i2_pa_statcast.csv')

          required={
              'game_date','season','game_pk','at_bat_number','batter','pitcher',
              'stand','p_throws','platoon','event_class'
          }
          missing=required-set(df.columns)
          assert not missing, missing
          assert manifest['market_inputs_used'] is False
          assert manifest['start']=='2023-03-01'
          assert manifest['end']=='2026-09-25'
          assert manifest['rows']==len(df)
          assert manifest['games']==df['game_pk'].nunique()
          assert df['event_class'].notna().all()
          assert df['batter'].notna().all()
          assert df['pitcher'].notna().all()
          assert set(df['stand'].dropna().astype(str)).issubset({'L','R'})
          assert set(df['p_throws'].dropna().astype(str)).issubset({'L','R'})
          assert not df.duplicated(['game_pk','at_bat_number']).any()
          assert sorted(df['season'].unique().tolist())==[2023,2024,2025,2026]

          summary={
              'rows':len(df),
              'games':int(df['game_pk'].nunique()),
              'batters':int(df['batter'].nunique()),
              'pitchers':int(df['pitcher'].nunique()),
              'season_rows':{str(int(k)):int(v) for k,v in df.groupby('season').size().items()},
              'event_counts':{str(k):int(v) for k,v in df['event_class'].value_counts().items()},
              'missing_stand':int(df['stand'].isna().sum()),
              'missing_p_throws':int(df['p_throws'].isna().sum()),
              'duplicate_pa':int(df.duplicated(['game_pk','at_bat_number']).sum()),
              'market_inputs_used':False,
          }
          (root/'phase2_validation.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload durable phase 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase2-historical-data
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/i2_pa_statcast.csv
            data/derived/i2_vnext/dataset_manifest.json
            data/derived/i2_vnext/phase2_validation.json
            data/derived/i2_vnext/arsenal/

      - name: Commit compact phase 2 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/dataset_manifest.json data/derived/i2_vnext/phase2_validation.json
          if git diff --cached --quiet; then
            echo "No compact phase 2 checkpoint changes"
          else
            git commit -m "research: checkpoint I2 vNext historical dataset"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
