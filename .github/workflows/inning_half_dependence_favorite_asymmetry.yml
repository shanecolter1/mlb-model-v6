name: Inning half dependence and favorite asymmetry
on:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - 'src/analysis/inning_half_dependence_favorite_asymmetry.py'
      - '.github/workflows/inning_half_dependence_favorite_asymmetry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/all-inning-engine-rebuild}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy tabulate
      - run: python src/analysis/inning_half_dependence_favorite_asymmetry.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/INNING_HALF_DEPENDENCE_FAVORITE_ASYMMETRY_2021_2025.md data/derived/all_inning/inning_half_dependence_overall_2021_2025.csv data/derived/all_inning/inning_favorite_asymmetry_buckets_2021_2025.csv data/derived/all_inning/inning_half_dependence_by_season_2021_2025.csv data/derived/all_inning/inning_favorite_asymmetry_spread_2021_2025.csv
          git diff --cached --quiet || git commit -m 'Add inning half-dependence and favorite asymmetry results'
          git push
