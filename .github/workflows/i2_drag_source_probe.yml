name: I2 temporal research - Savant drag source probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_drag_source_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Savant drag page metadata
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen
          url='https://baseballsavant.mlb.com/drag-dashboard'
          request=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          with urlopen(request,timeout=30) as response:
              page=response.read().decode('utf-8','replace')
              print('status',response.status,'bytes',len(page))
          print('scripts',re.findall(r'<script[^>]+src=["\']([^"\']+)',page)[:30])
          for pattern in ('drag', 'Drag', 'coefficient', 'chartData', 'api/'):
              matches=list(re.finditer(re.escape(pattern),page))
              print(pattern,'matches',len(matches))
              for m in matches[-5:]:
                  print(repr(page[max(0,m.start()-100):m.end()+150]))
          script_url=re.findall(r'<script[^>]+src=["\']([^"\']*drag-dashboard\.js)',page)[0]
          with urlopen(Request(script_url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as response:
              script=response.read().decode('utf-8','replace')
              print('drag_js_status',response.status,'bytes',len(script))
          from pathlib import Path
          Path('drag-dashboard-source.js').write_text(script)
          for pattern in ('fetch(', 'd3.csv', 'd3.json', '$.ajax', '$.get', 'drag-coeff', 'api/', '/drag'):
              matches=list(re.finditer(re.escape(pattern),script))
              print('js',pattern,'matches',len(matches))
              for m in matches[:8]:
                  print(repr(script[max(0,m.start()-180):m.end()+250]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: i2-public-drag-dashboard-source
          path: drag-dashboard-source.js
          retention-days: 2
