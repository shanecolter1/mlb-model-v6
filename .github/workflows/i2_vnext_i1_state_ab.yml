name: I2 vNext Phase AB - I1 state generator

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_i1_state_ab.yml'

permissions:
  contents: write

concurrency:
  group: i2-vnext-i1-state-ab
  cancel-in-progress: true

jobs:
  compare-i1-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install comparison dependency
        run: python -m pip install --upgrade pip numpy

      - name: Download bounded Retrosheet sources
        run: |
          set -euo pipefail
          mkdir -p data/raw/i2_vnext/retrosheet
          for year in 2023 2024; do
            curl --fail --location --retry 3               "https://www.retrosheet.org/downloads/plays/${year}plays.zip"               --output "data/raw/i2_vnext/retrosheet/${year}plays.zip"
          done

      - name: Build leakage-safe 2024 A-B inputs
        run: |
          python src/research/build_i1_state_ab_inputs.py             --season 2024             --retrosheet-zip data/raw/i2_vnext/retrosheet/2024plays.zip             --prior-retrosheet-zip data/raw/i2_vnext/retrosheet/2023plays.zip             --output data/derived/i2_vnext/i1_state_ab_2024_inputs.json

      - name: Syntax check
        run: |
          python -m py_compile src/research/build_i1_state_ab_inputs.py src/research/compare_i1_state_ab.py
          node --check src/research/run_i1_state_ab.mjs

      - name: Run exact I1 state A-B
        run: |
          node src/research/run_i1_state_ab.mjs             --input data/derived/i2_vnext/i1_state_ab_2024_inputs.json             --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json             --output data/derived/i2_vnext/i1_state_ab_2024_rows.json

      - name: Compare paired OOS performance
        run: |
          python src/research/compare_i1_state_ab.py             --input data/derived/i2_vnext/i1_state_ab_2024_rows.json             --output data/derived/i2_vnext/i1_state_ab_selection.json             --bootstrap 2000

      - name: Verify A-B governance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('data/derived/i2_vnext/i1_state_ab_selection.json').read_text())
          assert x['selection_year'] == 2024
          assert x['market_inputs_used'] is False
          assert x['governance']['2025_full_i2_holdout_consumed'] is False
          assert x['governance']['observed_i2_runs_used'] is False
          assert x['selected'] in ('league','player_asof')
          assert x['arms']['league']['n'] >= 4000
          assert x['arms']['player_asof']['n'] == x['arms']['league']['n']
          print(json.dumps(x,indent=2))
          PY

      - name: Upload phase A-B artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-i1-state-ab-2024
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/i1_state_ab_2024_inputs.json
            data/derived/i2_vnext/i1_state_ab_2024_rows.json
            data/derived/i2_vnext/i1_state_ab_selection.json

      - name: Commit compact A-B decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/i1_state_ab_selection.json
          if git diff --cached --quiet; then
            echo "No A-B checkpoint change"
          else
            git commit -m "research: checkpoint I1 state generator A-B"
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
