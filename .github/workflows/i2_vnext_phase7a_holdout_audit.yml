name: I2 vNext Phase 7A - holdout benchmark audit

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase7a_holdout_audit.yml'
      - 'src/research/audit_i2_vnext_holdout.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: i2-vnext-phase7a-holdout-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/i2-vnext-direct-talent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependency
        run: python -m pip install --upgrade pip numpy

      - name: Restore high-precision replay
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-phase5-precision
          path: data/derived/i2_vnext/precision
          run-id: 36278930125
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prior-season Retrosheet source
        run: |
          mkdir -p data/raw/i2_vnext/retrosheet
          curl --fail --location --retry 3             "https://www.retrosheet.org/downloads/plays/2024plays.zip"             --output data/raw/i2_vnext/retrosheet/2024plays.zip

      - name: Run leakage-safe holdout benchmark audit
        run: |
          python src/research/audit_i2_vnext_holdout.py             --replay data/derived/i2_vnext/precision/replay_2025_precision_10000.json             --calibration data/derived/i2_vnext/precision/i2_vnext_full_calibration_precision_10000.json             --prior-retrosheet-zip data/raw/i2_vnext/retrosheet/2024plays.zip             --prior-season 2024             --output data/derived/i2_vnext/phase7a_holdout_audit.json

      - name: Verify audit governance
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          a=json.loads(Path('data/derived/i2_vnext/phase7a_holdout_audit.json').read_text())
          assert a['market_inputs_used'] is False
          assert a['replay_games'] == 2430
          assert a['trials_per_game'] == 10000
          assert a['point_in_time_player_refits'] is True
          assert a['i1_state_mode'] == 'player_asof'
          assert a['prior_season_baseline']['season'] == 2024
          assert a['prior_season_baseline']['games'] >= 2400
          assert a['later_2025_validation']['selected_calibration_validation']['chosen'] == 'identity'
          assert a['governance']['2025_realized_prevalence_not_used_as_baseline_probability'] is True
          assert a['promotion_assessment']['status'] == 'SHADOW_ONLY'
          assert a['promotion_assessment']['independent_post_selection_test'] is False
          assert sum(x['n'] for x in a['monthly_diagnostics']) == 2430
          for period in ['all_2025', 'later_2025_validation']:
              u=a['uncertainty'][period]
              assert u['draws'] == 5000
              assert u['dates'] > 30
              for metric in ['brier_delta', 'logloss_delta', 'under_overprediction']:
                  assert all(math.isfinite(x) for x in u[metric]['ci95'])
                  assert u[metric]['ci95'][0] <= u[metric]['ci95'][1]
          for x in [
              a['all_2025']['vnext_raw']['brier'],
              a['all_2025']['vnext_raw']['logloss'],
              a['all_2025']['prior_season_constant']['brier'],
              a['all_2025']['prior_season_constant']['logloss'],
              a['discrimination']['auc'],
          ]:
              assert math.isfinite(x)
          print(json.dumps(a,indent=2))
          PY

      - name: Upload Phase 7A audit
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase7a-holdout-audit
          if-no-files-found: error
          retention-days: 14
          path: data/derived/i2_vnext/phase7a_holdout_audit.json

      - name: Commit compact Phase 7A checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/phase7a_holdout_audit.json
          if git diff --cached --quiet; then
            echo "No Phase 7A audit change"
          else
            git commit -m "research: checkpoint I2 vNext holdout benchmark audit"
            git stash --include-untracked
            git pull --rebase origin research/i2-vnext-direct-talent
            git push origin HEAD:research/i2-vnext-direct-talent
          fi
