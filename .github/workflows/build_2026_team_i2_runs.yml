name: Build 2026 team I2 runs
on:
  push:
    branches: [main]
    paths:
      - 'src/ingestion/build_2026_team_i2_runs.mjs'
      - '.github/workflows/build_2026_team_i2_runs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 2026 team I2 rates
        run: node src/ingestion/build_2026_team_i2_runs.mjs
      - name: Commit datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2/2026_team_second_inning_runs.csv data/derived/i2/2026_team_second_inning_runs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update 2026 team second-inning run rates"
          git push
