name: Bullpen between-inning history analysis
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/bullpen_between_inning_history.py'
      - '.github/workflows/bullpen_between_inning_history.yml'
  workflow_dispatch:
concurrency:
  group: bullpen-between-inning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-between-inning-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: empirical-batter-pitcher-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy
      - name: Build between-inning bullpen transition dataset
        shell: bash
        run: |
          set -euo pipefail
          python analysis/bullpen_between_inning_history.py | tee bullpen_between_inning_history.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullpen-between-inning-history-${{ github.sha }}
          path: |
            bullpen_between_inning_history.log
            data/derived/model_calibration/bullpen_transitions/bullpen_between_inning_boundaries_2025.csv
            data/derived/model_calibration/bullpen_transitions/bullpen_between_inning_summary_2025.json
          retention-days: 30
