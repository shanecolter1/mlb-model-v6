name: I2 Weekday Edge Analysis
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute Sunday offensive structure results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
          python - <<'PY'
          import csv, glob, os, collections, datetime, re, statistics

          def findfile(root, suffix):
              hits=[]
              for p in glob.glob(root+'/**', recursive=True):
                  if os.path.isfile(p) and os.path.basename(p).lower().endswith(suffix.lower()): hits.append(p)
              return hits[0] if hits else None

          # Existing I2 results.
          i2={}
          for path in sorted(glob.glob('data/derived/i2/i2_state_compact_20*.csv')):
              with open(path, newline='', encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      i2[r['gid']]=i2.get(r['gid'],0)+int(float(r['i2_runs'] or 0))

          # Retrosheet gameinfo across all five seasons.
          games=[]
          for year in range(2021,2026):
              gf=findfile(f'/tmp/retro/{year}','gameinfo.csv')
              with open(gf,newline='',encoding='utf-8-sig') as f:
                  for g in csv.DictReader(f):
                      gid=g['gid']
                      if gid not in i2: continue
                      ds=g['date'].replace('-','')
                      dt=datetime.datetime.strptime(ds,'%Y%m%d')
                      games.append({
                          'year':year,'gid':gid,'date':dt.date(),'day':dt.strftime('%A'),
                          'away':g['visteam'],'home':g['hometeam'],'daynight':(g.get('daynight') or '').strip().lower(),
                          'lineups_raw':g.get('lineups') or '', 'under':i2[gid]==0
                      })

          print('MATCHED',len(games))
          print('LINEUP_SAMPLES')
          for g in games[:5]: print(g['gid'],repr(g['lineups_raw']))

          # Retrosheet lineup string is comma-delimited player/position data. Extract player IDs and split visitor/home
          # using the first 9 and second 9 unique IDs when 18+ lineup IDs are available.
          idpat=re.compile(r'\b[a-z][a-z0-9]{3,7}\d{3}\b', re.I)
          def extract_lineups(raw):
              ids=idpat.findall(raw)
              uniq=[]
              for x in ids:
                  if x not in uniq: uniq.append(x)
              if len(uniq)>=18: return set(uniq[:9]),set(uniq[9:18])
              return None,None

          for g in games:
              g['away_lu'],g['home_lu']=extract_lineups(g['lineups_raw'])

          print('LINEUP_PARSE_OK',sum(g['away_lu'] is not None for g in games))

          # Prior-game lineup continuity for each team (same-season only).
          appearances=[]
          for g in games:
              appearances.append((g['date'],g['gid'],g['away'],'away',g))
              appearances.append((g['date'],g['gid'],g['home'],'home',g))
          appearances.sort(key=lambda x:(x[2],x[0],x[1]))
          prev={}
          for _,_,team,side,g in appearances:
              lu=g[f'{side}_lu']
              key=(g['year'],team)
              p=prev.get(key)
              if lu is not None and p is not None:
                  g[f'{side}_returners']=len(lu & p)
              else: g[f'{side}_returners']=None
              if lu is not None: prev[key]=lu

          # Series grouping: same home/away pairing, games no more than 2 days apart.
          bypair=collections.defaultdict(list)
          for g in games: bypair[(g['year'],g['away'],g['home'])].append(g)
          for arr in bypair.values():
              arr.sort(key=lambda g:(g['date'],g['gid']))
              groups=[]; cur=[]; last=None
              for g in arr:
                  if last is None or (g['date']-last).days<=2:
                      cur.append(g)
                  else:
                      groups.append(cur); cur=[g]
                  last=g['date']
              if cur: groups.append(cur)
              for grp in groups:
                  for j,g in enumerate(grp,1):
                      g['series_game']=j; g['series_len']=len(grp); g['series_finale']=(j==len(grp))

          def rate(rows):
              return (len(rows),100*sum(r['under'] for r in rows)/len(rows)) if rows else (0,float('nan'))

          print('\nDAY_NIGHT_BY_WEEKDAY')
          print('day,daynight,games,under_pct')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              for dn in ['day','night']:
                  rr=[g for g in games if g['day']==d and g['daynight']==dn]
                  n,p=rate(rr)
                  if n: print(f'{d},{dn},{n},{p:.3f}')

          sun=[g for g in games if g['day']=='Sunday']
          print('\nSUNDAY_LINEUP_CONTINUITY')
          print('bucket,games,under_pct,avg_combined_returners')
          valid=[g for g in sun if g.get('away_returners') is not None and g.get('home_returners') is not None]
          for label,lo,hi in [('<=12',0,12),('13-14',13,14),('15-16',15,16),('17-18',17,18)]:
              rr=[g for g in valid if lo <= g['away_returners']+g['home_returners'] <= hi]
              n,p=rate(rr)
              if n: print(f'{label},{n},{p:.3f},{statistics.mean(g["away_returners"]+g["home_returners"] for g in rr):.2f}')

          print('\nALL_DAYS_LINEUP_CONTINUITY')
          print('day,games,avg_combined_returners,under_pct')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              rr=[g for g in games if g['day']==d and g.get('away_returners') is not None and g.get('home_returners') is not None]
              n,p=rate(rr)
              if n: print(f'{d},{n},{statistics.mean(g["away_returners"]+g["home_returners"] for g in rr):.3f},{p:.3f}')

          print('\nSUNDAY_SERIES_POSITION')
          print('series_game,games,under_pct')
          for sg in [1,2,3,4,5]:
              rr=[g for g in sun if g.get('series_game')==sg]
              n,p=rate(rr)
              if n: print(f'{sg},{n},{p:.3f}')
          rr=[g for g in sun if g.get('series_finale')]
          n,p=rate(rr); print(f'finale,{n},{p:.3f}')
          rr=[g for g in sun if not g.get('series_finale')]
          n,p=rate(rr); print(f'not_finale,{n},{p:.3f}')

          print('\nSUNDAY_COMBINATIONS')
          print('filter,games,under_pct,fair_under')
          combos=[]
          combos.append(('Sunday day', [g for g in sun if g['daynight']=='day']))
          combos.append(('Sunday night', [g for g in sun if g['daynight']=='night']))
          combos.append(('Sunday finale', [g for g in sun if g.get('series_finale')]))
          combos.append(('Sunday day finale', [g for g in sun if g['daynight']=='day' and g.get('series_finale')]))
          combos.append(('Sunday day + <=14 returners', [g for g in valid if g['daynight']=='day' and g['away_returners']+g['home_returners']<=14]))
          combos.append(('Sunday finale + <=14 returners', [g for g in valid if g.get('series_finale') and g['away_returners']+g['home_returners']<=14]))
          combos.append(('Sunday day finale + <=14 returners', [g for g in valid if g['daynight']=='day' and g.get('series_finale') and g['away_returners']+g['home_returners']<=14]))
          for label,rr in combos:
              n,pct=rate(rr)
              if not n: continue
              p=pct/100
              fair=(-100*p/(1-p)) if p>=.5 else (100*(1-p)/p)
              print(f'{label},{n},{pct:.3f},{fair:.1f}')

          # Year stability for the most useful candidate filters.
          print('\nSUNDAY_CANDIDATES_BY_YEAR')
          print('year,filter,games,under_pct')
          for y in range(2021,2026):
              candidates={
                  'all_sunday':[g for g in sun if g['year']==y],
                  'day':[g for g in sun if g['year']==y and g['daynight']=='day'],
                  'finale':[g for g in sun if g['year']==y and g.get('series_finale')],
                  'day_finale':[g for g in sun if g['year']==y and g['daynight']=='day' and g.get('series_finale')]
              }
              for label,rr in candidates.items():
                  n,p=rate(rr)
                  if n: print(f'{y},{label},{n},{p:.3f}')
          PY
