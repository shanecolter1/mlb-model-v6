name: I2 Weekday Edge Analysis
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute Sunday lineup and series results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
          python - <<'PY'
          import csv, glob, os, collections, datetime, statistics
          def findfile(root,suffix):
              for p in glob.glob(root+'/**',recursive=True):
                  if os.path.isfile(p) and os.path.basename(p).lower().endswith(suffix.lower()): return p
          i2={}
          for p in glob.glob('data/derived/i2/i2_state_compact_20*.csv'):
              with open(p,newline='',encoding='utf-8') as f:
                  for r in csv.DictReader(f): i2[r['gid']]=i2.get(r['gid'],0)+int(float(r['i2_runs'] or 0))
          games=[]; by_gid={}
          for y in range(2021,2026):
              root=f'/tmp/retro/{y}'
              with open(findfile(root,'gameinfo.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      if r['gid'] not in i2: continue
                      dt=datetime.datetime.strptime(r['date'].replace('-',''),'%Y%m%d').date()
                      g={'year':y,'gid':r['gid'],'date':dt,'day':dt.strftime('%A'),'away':r['visteam'],'home':r['hometeam'],'daynight':(r.get('daynight') or '').lower(),'under':i2[r['gid']]==0}
                      games.append(g); by_gid[r['gid']]=g
              with open(findfile(root,'teamstats.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      g=by_gid.get(r['gid'])
                      if not g: continue
                      lu={r.get(f'start_l{i}') for i in range(1,10) if r.get(f'start_l{i}')}
                      side='home' if r.get('vishome')=='h' else 'away'
                      g[side+'_lu']=lu if lu else None
          # Prior-game continuity.
          apps=[]
          for g in games:
              apps += [(g['year'],g['away'],g['date'],g['gid'],'away',g),(g['year'],g['home'],g['date'],g['gid'],'home',g)]
          apps.sort(key=lambda x:(x[0],x[1],x[2],x[3]))
          prev={}
          for y,team,_,_,side,g in apps:
              lu=g.get(side+'_lu'); key=(y,team); p=prev.get(key)
              g[side+'_ret']=len(lu&p) if lu and p else None
              if lu: prev[key]=lu
          # Series grouping.
          pairs=collections.defaultdict(list)
          for g in games: pairs[(g['year'],g['away'],g['home'])].append(g)
          for arr in pairs.values():
              arr.sort(key=lambda g:(g['date'],g['gid'])); groups=[]; cur=[]; last=None
              for g in arr:
                  if last is None or (g['date']-last).days<=2: cur.append(g)
                  else: groups.append(cur); cur=[g]
                  last=g['date']
              if cur: groups.append(cur)
              for grp in groups:
                  for j,g in enumerate(grp,1): g['sg']=j; g['sl']=len(grp); g['finale']=(j==len(grp))
          def out(label,rr):
              n=len(rr)
              if not n: return
              p=sum(g['under'] for g in rr)/n; fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
              print(f'{label},{n},{100*p:.3f},{fair:.1f}')
          sun=[g for g in games if g['day']=='Sunday']
          valid=[g for g in sun if g.get('away_ret') is not None and g.get('home_ret') is not None]
          print('LINEUP_PARSE_GAMES',sum(g.get('away_lu') and g.get('home_lu') for g in games))
          print('\nWEEKDAY_LINEUP_CONTINUITY')
          print('day,games,avg_combined_returners,under_pct')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              rr=[g for g in games if g['day']==d and g.get('away_ret') is not None and g.get('home_ret') is not None]
              if rr: print(f'{d},{len(rr)},{statistics.mean(g["away_ret"]+g["home_ret"] for g in rr):.3f},{100*sum(g["under"] for g in rr)/len(rr):.3f}')
          print('\nSUNDAY_LINEUP_BUCKETS')
          print('filter,games,under_pct,fair_under')
          for label,lo,hi in [('<=12 returners',0,12),('13-14 returners',13,14),('15-16 returners',15,16),('17-18 returners',17,18)]: out(label,[g for g in valid if lo<=g['away_ret']+g['home_ret']<=hi])
          out('Sunday day <=14',[g for g in valid if g['daynight']=='day' and g['away_ret']+g['home_ret']<=14])
          out('Sunday Game4',[g for g in sun if g.get('sg')==4])
          out('Sunday Game4 <=14',[g for g in valid if g.get('sg')==4 and g['away_ret']+g['home_ret']<=14])
          out('Sunday Game4 15+',[g for g in valid if g.get('sg')==4 and g['away_ret']+g['home_ret']>=15])
          out('Sunday night',[g for g in sun if g['daynight']=='night'])
          print('\nGAME4_BY_YEAR')
          print('year,games,under_pct')
          for y in range(2021,2026):
              rr=[g for g in sun if g['year']==y and g.get('sg')==4]
              if rr: print(f'{y},{len(rr)},{100*sum(g["under"] for g in rr)/len(rr):.3f}')
          print('\nNIGHT_BY_YEAR')
          print('year,games,under_pct')
          for y in range(2021,2026):
              rr=[g for g in sun if g['year']==y and g['daynight']=='night']
              if rr: print(f'{y},{len(rr)},{100*sum(g["under"] for g in rr)/len(rr):.3f}')
          PY
