name: I2 Weekday Edge Analysis
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute rolling regular-core rest and series results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
          python - <<'PY'
          import csv, glob, os, collections, datetime, statistics

          WINDOW=30
          MIN_HISTORY=15

          def findfile(root,suffix):
              for p in glob.glob(root+'/**',recursive=True):
                  if os.path.isfile(p) and os.path.basename(p).lower().endswith(suffix.lower()): return p

          # Full-game I2 outcomes from compact state files.
          i2={}
          for p in glob.glob('data/derived/i2/i2_state_compact_20*.csv'):
              with open(p,newline='',encoding='utf-8') as f:
                  for r in csv.DictReader(f):
                      i2[r['gid']]=i2.get(r['gid'],0)+int(float(r['i2_runs'] or 0))

          games=[]; by_gid={}
          for y in range(2021,2026):
              root=f'/tmp/retro/{y}'
              with open(findfile(root,'gameinfo.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      if r['gid'] not in i2: continue
                      dt=datetime.datetime.strptime(r['date'].replace('-',''),'%Y%m%d').date()
                      g={'year':y,'gid':r['gid'],'date':dt,'day':dt.strftime('%A'),'away':r['visteam'],'home':r['hometeam'],
                         'daynight':(r.get('daynight') or '').lower(),'under':i2[r['gid']]==0}
                      games.append(g); by_gid[r['gid']]=g
              with open(findfile(root,'teamstats.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      g=by_gid.get(r['gid'])
                      if not g: continue
                      lu=[r.get(f'start_l{i}') for i in range(1,10) if r.get(f'start_l{i}')]
                      side='home' if r.get('vishome')=='h' else 'away'
                      g[side+'_lu']=set(lu) if lu else None

          # Build one ordered appearance stream per team-season and define the pregame regular core
          # from the PRIOR 30 team games only. This never uses the current game or future games.
          team_games=collections.defaultdict(list)
          for g in games:
              team_games[(g['year'],g['away'])].append((g['date'],g['gid'],'away',g))
              team_games[(g['year'],g['home'])].append((g['date'],g['gid'],'home',g))

          for key,arr in team_games.items():
              arr.sort(key=lambda x:(x[0],x[1]))
              hist=[]
              for _,_,side,g in arr:
                  cur=g.get(side+'_lu')
                  if cur is not None and len(hist)>=MIN_HISTORY:
                      prior=hist[-WINDOW:]
                      counts=collections.Counter()
                      for lu in prior:
                          counts.update(lu)
                      core={pid for pid,_ in counts.most_common(9)}
                      absent=len(core-cur)
                      g[side+'_core']=core
                      g[side+'_regular_absent']=absent
                      g[side+'_history_n']=len(prior)
                  else:
                      g[side+'_regular_absent']=None
                  if cur is not None:
                      hist.append(cur)

          # Series position: contiguous same away/home pairing with <=2-day gaps.
          pairs=collections.defaultdict(list)
          for g in games: pairs[(g['year'],g['away'],g['home'])].append(g)
          for arr in pairs.values():
              arr.sort(key=lambda g:(g['date'],g['gid'])); groups=[]; cur=[]; last=None
              for g in arr:
                  if last is None or (g['date']-last).days<=2: cur.append(g)
                  else: groups.append(cur); cur=[g]
                  last=g['date']
              if cur: groups.append(cur)
              for grp in groups:
                  for j,g in enumerate(grp,1):
                      g['sg']=j; g['sl']=len(grp); g['finale']=(j==len(grp))

          valid=[g for g in games if g.get('away_regular_absent') is not None and g.get('home_regular_absent') is not None]
          for g in valid:
              g['absent_total']=g['away_regular_absent']+g['home_regular_absent']

          def summarize(label,rr):
              n=len(rr)
              if not n: return
              p=sum(g['under'] for g in rr)/n
              fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
              avga=statistics.mean(g['absent_total'] for g in rr if 'absent_total' in g) if rr and all('absent_total' in g for g in rr) else float('nan')
              print(f'{label},{n},{100*p:.3f},{fair:.1f},{avga:.3f}')

          print('VALID_CORE_GAMES',len(valid))
          print('\nREGULAR_ABSENCE_BUCKETS')
          print('filter,games,under_pct,fair_under,avg_absent')
          for label,lo,hi in [('0 absent',0,0),('1 absent',1,1),('2 absent',2,2),('3 absent',3,3),('4+ absent',4,99)]:
              summarize(label,[g for g in valid if lo<=g['absent_total']<=hi])

          print('\nWEEKDAY_REGULAR_REST')
          print('day,games,avg_absent,under_pct')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              rr=[g for g in valid if g['day']==d]
              if rr:
                  print(f'{d},{len(rr)},{statistics.mean(g["absent_total"] for g in rr):.3f},{100*sum(g["under"] for g in rr)/len(rr):.3f}')

          print('\nSERIES_POSITION')
          print('series_game,games,avg_absent,under_pct,fair_under')
          for sg in [1,2,3,4,5]:
              rr=[g for g in valid if g.get('sg')==sg]
              if rr:
                  p=sum(g['under'] for g in rr)/len(rr); fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
                  print(f'{sg},{len(rr)},{statistics.mean(g["absent_total"] for g in rr):.3f},{100*p:.3f},{fair:.1f}')

          print('\nSERIES_X_REST')
          print('series_game,rest_bucket,games,under_pct,fair_under')
          for sg in [1,2,3,4]:
              for label,lo,hi in [('0-1',0,1),('2',2,2),('3+',3,99)]:
                  rr=[g for g in valid if g.get('sg')==sg and lo<=g['absent_total']<=hi]
                  if len(rr)>=25:
                      p=sum(g['under'] for g in rr)/len(rr); fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
                      print(f'{sg},{label},{len(rr)},{100*p:.3f},{fair:.1f}')

          print('\nWEEKDAY_X_SERIES')
          print('day,series_game,games,avg_absent,under_pct,fair_under')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              for sg in [1,2,3,4]:
                  rr=[g for g in valid if g['day']==d and g.get('sg')==sg]
                  if len(rr)>=25:
                      p=sum(g['under'] for g in rr)/len(rr); fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
                      print(f'{d},{sg},{len(rr)},{statistics.mean(g["absent_total"] for g in rr):.3f},{100*p:.3f},{fair:.1f}')

          print('\nSUNDAY_SERIES_X_REST')
          print('series_game,rest_bucket,games,under_pct,fair_under')
          for sg in [1,2,3,4]:
              for label,lo,hi in [('0-1',0,1),('2',2,2),('3+',3,99)]:
                  rr=[g for g in valid if g['day']=='Sunday' and g.get('sg')==sg and lo<=g['absent_total']<=hi]
                  if len(rr)>=15:
                      p=sum(g['under'] for g in rr)/len(rr); fair=(-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
                      print(f'{sg},{label},{len(rr)},{100*p:.3f},{fair:.1f}')

          print('\nGAME4_BY_YEAR_AND_REST')
          print('year,rest_bucket,games,under_pct')
          for y in range(2021,2026):
              for label,lo,hi in [('0-1',0,1),('2',2,2),('3+',3,99)]:
                  rr=[g for g in valid if g['year']==y and g.get('sg')==4 and lo<=g['absent_total']<=hi]
                  if rr:
                      print(f'{y},{label},{len(rr)},{100*sum(g["under"] for g in rr)/len(rr):.3f}')
          PY
