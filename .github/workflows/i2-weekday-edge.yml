name: I2 Weekday Edge Analysis
on:
  push:
    branches:
      - analysis/i2-weekday-edge-20260906
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute role-dominant regular rest and series results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/retro
          for y in 2021 2022 2023 2024 2025; do
            curl -fsSL "https://www.retrosheet.org/downloads/${y}/${y}csvs.zip" -o "/tmp/retro/${y}.zip"
            mkdir -p "/tmp/retro/${y}"
            unzip -q "/tmp/retro/${y}.zip" -d "/tmp/retro/${y}"
          done
          python - <<'PY'
          import csv, glob, os, collections, datetime, statistics

          WINDOW=30
          MIN_HISTORY=15
          ROLE_SHARE=.70
          MIN_ROLE_STARTS=15

          def findfile(root,suffix):
              for p in glob.glob(root+'/**',recursive=True):
                  if os.path.isfile(p) and os.path.basename(p).lower().endswith(suffix.lower()): return p

          i2={}
          for p in glob.glob('data/derived/i2/i2_state_compact_20*.csv'):
              with open(p,newline='',encoding='utf-8') as f:
                  for r in csv.DictReader(f): i2[r['gid']]=i2.get(r['gid'],0)+int(float(r['i2_runs'] or 0))

          games=[]; by_gid={}
          for y in range(2021,2026):
              root=f'/tmp/retro/{y}'
              with open(findfile(root,'gameinfo.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      if r['gid'] not in i2: continue
                      dt=datetime.datetime.strptime(r['date'].replace('-',''),'%Y%m%d').date()
                      g={'year':y,'gid':r['gid'],'date':dt,'day':dt.strftime('%A'),'away':r['visteam'],'home':r['hometeam'],
                         'daynight':(r.get('daynight') or '').lower(),'under':i2[r['gid']]==0}
                      games.append(g); by_gid[r['gid']]=g
              with open(findfile(root,'teamstats.csv'),newline='',encoding='utf-8-sig') as f:
                  for r in csv.DictReader(f):
                      g=by_gid.get(r['gid'])
                      if not g: continue
                      side='home' if r.get('vishome')=='h' else 'away'
                      lineup={r.get(f'start_l{i}') for i in range(1,10) if r.get(f'start_l{i}')}
                      roles={pos:r.get(f'start_f{pos}') for pos in range(2,11) if r.get(f'start_f{pos}')}
                      g[side+'_lu']=lineup
                      g[side+'_roles']=roles

          team_games=collections.defaultdict(list)
          for g in games:
              team_games[(g['year'],g['away'])].append((g['date'],g['gid'],'away',g))
              team_games[(g['year'],g['home'])].append((g['date'],g['gid'],'home',g))

          for key,arr in team_games.items():
              arr.sort(key=lambda x:(x[0],x[1])); hist=[]
              for _,_,side,g in arr:
                  cur_lu=g.get(side+'_lu'); cur_roles=g.get(side+'_roles')
                  if cur_lu is not None and cur_roles is not None and len(hist)>=MIN_HISTORY:
                      prior=hist[-WINDOW:]
                      established=set(); role_details=[]
                      for pos in range(2,11):
                          vals=[h[pos] for h in prior if pos in h and h[pos]]
                          if not vals: continue
                          c=collections.Counter(vals); pid,n=c.most_common(1)[0]
                          share=n/len(vals)
                          if n>=MIN_ROLE_STARTS and share>=ROLE_SHARE:
                              established.add(pid); role_details.append((pos,pid,n,share))
                      rested={pid for pid in established if pid not in cur_lu}
                      g[side+'_established']=established
                      g[side+'_rested']=rested
                      g[side+'_n_established']=len(established)
                      g[side+'_n_rested']=len(rested)
                      g[side+'_role_details']=role_details
                  else:
                      g[side+'_n_rested']=None
                  if cur_roles: hist.append(cur_roles)

          pairs=collections.defaultdict(list)
          for g in games: pairs[(g['year'],g['away'],g['home'])].append(g)
          for arr in pairs.values():
              arr.sort(key=lambda g:(g['date'],g['gid'])); groups=[]; cur=[]; last=None
              for g in arr:
                  if last is None or (g['date']-last).days<=2: cur.append(g)
                  else: groups.append(cur); cur=[g]
                  last=g['date']
              if cur: groups.append(cur)
              for grp in groups:
                  for j,g in enumerate(grp,1): g['sg']=j; g['sl']=len(grp); g['finale']=(j==len(grp))

          valid=[g for g in games if g.get('away_n_rested') is not None and g.get('home_n_rested') is not None]
          for g in valid:
              g['rested_total']=g['away_n_rested']+g['home_n_rested']
              g['est_total']=g.get('away_n_established',0)+g.get('home_n_established',0)

          def fair(p): return (-100*p/(1-p)) if p>=.5 else 100*(1-p)/p
          def show(label,rr):
              if not rr: return
              p=sum(g['under'] for g in rr)/len(rr)
              print(f'{label},{len(rr)},{statistics.mean(g["rested_total"] for g in rr):.3f},{statistics.mean(g["est_total"] for g in rr):.3f},{100*p:.3f},{fair(p):.1f}')

          print('VALID_ROLE_CORE_GAMES',len(valid))
          print('AVG_ESTABLISHED_PER_GAME',statistics.mean(g['est_total'] for g in valid))
          print('\nREST_BUCKETS')
          print('filter,games,avg_rested,avg_established,under_pct,fair_under')
          for label,lo,hi in [('0 rested',0,0),('1 rested',1,1),('2 rested',2,2),('3+ rested',3,99)]:
              show(label,[g for g in valid if lo<=g['rested_total']<=hi])

          print('\nWEEKDAY_REST')
          print('day,games,avg_rested,avg_established,under_pct,fair_under')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              show(d,[g for g in valid if g['day']==d])

          print('\nSERIES_POSITION')
          print('series_game,games,avg_rested,avg_established,under_pct,fair_under')
          for sg in [1,2,3,4,5]: show(str(sg),[g for g in valid if g.get('sg')==sg])

          print('\nSERIES_X_REST')
          print('series_game,rest_bucket,games,under_pct,fair_under')
          for sg in [1,2,3,4]:
              for label,lo,hi in [('0',0,0),('1',1,1),('2+',2,99)]:
                  rr=[g for g in valid if g.get('sg')==sg and lo<=g['rested_total']<=hi]
                  if len(rr)>=25:
                      p=sum(g['under'] for g in rr)/len(rr)
                      print(f'{sg},{label},{len(rr)},{100*p:.3f},{fair(p):.1f}')

          print('\nWEEKDAY_X_SERIES')
          print('day,series_game,games,avg_rested,under_pct,fair_under')
          for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']:
              for sg in [1,2,3,4]:
                  rr=[g for g in valid if g['day']==d and g.get('sg')==sg]
                  if len(rr)>=25:
                      p=sum(g['under'] for g in rr)/len(rr)
                      print(f'{d},{sg},{len(rr)},{statistics.mean(g["rested_total"] for g in rr):.3f},{100*p:.3f},{fair(p):.1f}')

          print('\nSUNDAY_SERIES_X_REST')
          print('series_game,rest_bucket,games,under_pct,fair_under')
          for sg in [2,3,4]:
              for label,lo,hi in [('0',0,0),('1',1,1),('2+',2,99)]:
                  rr=[g for g in valid if g['day']=='Sunday' and g.get('sg')==sg and lo<=g['rested_total']<=hi]
                  if len(rr)>=15:
                      p=sum(g['under'] for g in rr)/len(rr)
                      print(f'{sg},{label},{len(rr)},{100*p:.3f},{fair(p):.1f}')

          print('\nGAME4_BY_YEAR')
          print('year,rest_bucket,games,under_pct')
          for y in range(2021,2026):
              for label,lo,hi in [('0',0,0),('1',1,1),('2+',2,99)]:
                  rr=[g for g in valid if g['year']==y and g.get('sg')==4 and lo<=g['rested_total']<=hi]
                  if rr: print(f'{y},{label},{len(rr)},{100*sum(g["under"] for g in rr)/len(rr):.3f}')

          print('\nSUNDAY_GAME4_BY_YEAR')
          print('year,games,avg_rested,under_pct')
          for y in range(2021,2026):
              rr=[g for g in valid if g['year']==y and g['day']=='Sunday' and g.get('sg')==4]
              if rr: print(f'{y},{len(rr)},{statistics.mean(g["rested_total"] for g in rr):.3f},{100*sum(g["under"] for g in rr)/len(rr):.3f}')
          PY
