name: All-inning M1 PA-history reliability validation

on:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - src/analysis/all_inning/build_m1_pa_history_asof.py
      - src/analysis/all_inning/m1_pa_history_reliability_validation.py
      - .github/workflows/all_inning_m1_pa_history_reliability_validation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download normalized 2021-2024 PA artifacts only
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33336358517
          pattern: normalized-mlb-202[1-4]
          path: /tmp/normalized
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33450762451
          name: all-inning-m1-pa-matchup-development-2021-2024
          path: /tmp/m1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33504815582
          name: all-inning-statcast-asof-features-2021-2024
          path: /tmp/statcast
      - name: Build strictly prior-date PA-history counts
        run: |
          python src/analysis/all_inning/build_m1_pa_history_asof.py \
            --normalized-root /tmp/normalized \
            --output-dir /tmp/history
      - name: Run chronological PA-history and reliability challenger
        run: |
          python src/analysis/all_inning/m1_pa_history_reliability_validation.py \
            --m1-matrix /tmp/m1/m1_pa_matchup_development.parquet \
            --statcast-batter-asof /tmp/statcast/statcast_batter_asof.parquet \
            --statcast-pitcher-asof /tmp/statcast/statcast_pitcher_asof.parquet \
            --history-batter-asof /tmp/history/m1_pa_history_batter_asof.parquet \
            --history-pitcher-asof /tmp/history/m1_pa_history_pitcher_asof.parquet \
            --history-league-asof /tmp/history/m1_pa_history_league_asof.parquet \
            --history-manifest /tmp/history/manifest.json \
            --statcast-selected-specs data/derived/all_inning/m1_statcast_family_incremental/m1_statcast_family_selected_specs.csv \
            --statcast-joint-manifest data/derived/all_inning/m1_statcast_joint_redundancy/manifest.json \
            --output-dir /tmp/pa_history_gate
      - name: Governance audit
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          history=json.load(open('/tmp/history/manifest.json'))
          gate=json.load(open('/tmp/pa_history_gate/manifest.json'))
          marginal=pd.read_csv('/tmp/pa_history_gate/m1_pa_history_marginal_status.csv')
          stable=pd.read_csv('/tmp/pa_history_gate/m1_pa_history_joint_stable_metrics.csv')
          assert history['status']=='PASS'
          assert history['development_seasons']==[2021,2022,2023,2024]
          assert history['same_day_history_included'] is False
          assert history['fixed_shrinkage_used'] is False
          assert history['holdout_opened'] is False and history['market_data_used'] is False
          assert gate['status']=='PASS'
          assert gate['development_seasons']==[2021,2022,2023,2024]
          assert gate['candidate_specification_selection_year']==2022
          assert gate['joint_subset_selection_year']==2023
          assert gate['development_confirmation_year']==2024
          assert gate['holdout_opened'] is False and gate['market_data_used'] is False
          assert gate['fixed_shrinkage_used'] is False
          assert gate['target_innings']==list(range(1,10))
          assert max(gate['raw_365d_core_reproduction_max_abs_error'].values()) <= 1e-12
          assert len(marginal)==16
          assert set(marginal.event)=={'k','baserunner','hr','nonhr_hit'}
          assert set(stable.test_year)=={2023,2024}
          print(marginal.to_string(index=False))
          print(stable.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-inning-m1-pa-history-reliability-2021-2024
          path: |
            /tmp/history/
            /tmp/pa_history_gate/
          retention-days: 30
