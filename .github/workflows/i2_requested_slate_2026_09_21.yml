name: Requested Sep 21 I2 slate
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      I2_DATE: '2026-09-21'
      I2_TRIALS: '50000'
      MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      I2_RUN_ENVIRONMENT: data/runtime/i2/2026-09-21_run_environment.json
      I2_LINEUP_OVERRIDES: data/runtime/i2/2026-09-21_lineup_overrides.json
      I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
      I2_OUTPUT: data/runtime/i2/2026-09-21_requested_parent.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot slate and series numbers
        run: |
          echo "I2_CUTOFF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=process.env.I2_DATE;
          let s,source;
          for(const [label,url] of [['PRIMARY',`${process.env.MLB_OTHER_MODEL_BASE_URL}/.netlify/functions/mlb?type=schedule&date=${d}`],['FALLBACK',`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${d}&hydrate=probablePitcher,team,venue`]]){
            try{const r=await fetch(url,{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(r.status);s=await r.json();if(!s.dates)throw Error('dates missing');source=label;break;}catch(e){console.log(label,String(e));}
          }
          if(!s?.dates)throw Error('Schedule unavailable');
          const out={date:d,capturedAt:new Date().toISOString(),source,games:s.dates.flatMap(x=>x.games||[]).map(g=>({gamePk:g.gamePk,gameDate:g.gameDate,away:g.teams.away.team.name,home:g.teams.home.team.name,seriesGameNumber:g.seriesGameNumber,gamesInSeries:g.gamesInSeries,status:g.status,awayStarter:g.teams.away.probablePitcher?.fullName,homeStarter:g.teams.home.probablePitcher?.fullName}))};
          fs.mkdirSync('data/runtime/i2',{recursive:true});
          fs.writeFileSync(`data/runtime/i2/${d}_requested_slate.json`,JSON.stringify(out,null,2));
          console.log('SLATE_REPORT',JSON.stringify(out));
          NODE
      - name: Capture required approved total points
        run: node src/pipeline/fetch_i2_run_environment.mjs
      - name: Prepare existing preliminary lineup fallback
        run: node src/pipeline/build_preliminary_lineups_from_last_game.mjs
      - name: Run unchanged parent model
        run: node src/pipeline/run_i2_total_conditioned.mjs
      - name: Run unchanged production calibration
        env:
          I2_INPUT: data/runtime/i2/2026-09-21_requested_parent.json
          I2_OUTPUT: data/runtime/i2/2026-09-21_requested_v04.json
        run: node src/pipeline/apply_i2_v04_local_cv.mjs
      - name: Print output and input audit
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const f='data/runtime/i2/2026-09-21_requested_v04.json';
          if(fs.existsSync(f)){
            const p=JSON.parse(fs.readFileSync(f));
            console.log('MODEL_REPORT',JSON.stringify({model:p.model,date:p.date,generatedAt:p.generatedAt,cutoff:p.cutoff,ranking:p.ranking,sourcePriorityAudit:p.sourcePriorityAudit,lineupOverrideAudit:p.lineupOverrideAudit,limitations:p.knownResearchLimitations,games:p.games.map(g=>({gamePk:g.gamePk,status:g.modelStatus,lineupFeedConfirmed:g.lineupFeedConfirmed,awayLineup:g.awayLineup,homeLineup:g.homeLineup,dataAudit:g.dataAudit}))}));
          }else console.log('NO_COMPLETED_V04_OUTPUT');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i2-requested-2026-09-21
          path: data/runtime/i2/2026-09-21*.json
          retention-days: 7
