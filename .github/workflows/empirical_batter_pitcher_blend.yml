name: Empirical batter pitcher blend calibration

on:
  pull_request:
    paths:
      - 'analysis/batter_pitcher_blend_calibration.py'
      - 'analysis/batter_pitcher_blend_calibration_fast.py'
      - 'analysis/half_inning_scoring_gate.py'
      - 'analysis/half_inning_scoring_gate_fast.py'
      - 'analysis/half_inning_dp_engine.py'
      - 'analysis/test_half_inning_dp_equivalence.py'
      - '.github/workflows/empirical_batter_pitcher_blend.yml'
  workflow_dispatch:

concurrency:
  group: empirical-batter-pitcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calibration dependencies
        run: pip install --disable-pip-version-check numpy scikit-learn
      - name: Run staged leakage-safe joint multinomial calibration
        run: |
          set -euo pipefail
          python analysis/batter_pitcher_blend_calibration_fast.py | tee batter_pitcher_blend.log
      - name: Verify PA gate
        run: |
          set -euo pipefail
          base=data/derived/model_calibration/batter_pitcher_blend
          for f in model_development_manifest.json joint_multinomial_pa_model.json multinomial_grid_2024.csv end_2024_skill_state.json; do
            test -s "$base/$f" || { echo "MISSING ARTIFACT: $base/$f"; exit 1; }
          done
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/derived/model_calibration/batter_pitcher_blend/model_development_manifest.json').read_text())
          assert m['development_years']==[2021,2022,2023]
          assert m['selection_year']==[2024]
          assert m['locked_validation_year']==[2025]
          assert m['market_inputs_used'] is False
          assert m['same_game_updates_used_in_features'] is False
          assert m['rolling_history_crosses_season_boundaries'] is True
          assert m['convergence']['converged'] is True
          if m['governance_status']!='PA_GATE_PASS_HALF_INNING_PENDING':
              raise SystemExit(f"MODEL BLOCKED AT PA GATE: {m['governance_status']} {m['validation_2025']}")
          print('Joint PA gate PASS with convergence')
          PY
      - name: Verify exact DP equivalence and latency
        run: |
          set -euo pipefail
          python analysis/test_half_inning_dp_equivalence.py | tee half_inning_dp_validation.log
      - name: Run locked-2025 half-inning scoring gate
        run: |
          set -euo pipefail
          python analysis/half_inning_scoring_gate_fast.py | tee half_inning_scoring_gate.log
      - name: Verify final governance
        run: |
          set -euo pipefail
          base=data/derived/model_calibration/batter_pitcher_blend
          test -s "$base/half_inning_validation_2025.json"
          test -s "$base/dp_engine_validation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('data/derived/model_calibration/batter_pitcher_blend')
          d=json.loads((base/'dp_engine_validation.json').read_text())
          if d['equivalence_status']!='PASS' or d['latency_status']!='PASS':
              raise SystemExit(f"DP ENGINE NOT PRODUCTION ELIGIBLE: {d}")
          m=json.loads((base/'model_development_manifest.json').read_text())
          if m['governance_status']!='PASS' or m['production_eligible'] is not True:
              raise SystemExit(f"MODEL NOT PRODUCTION ELIGIBLE: {m['governance_status']}")
          print('Joint PA + exact DP + half-inning governance PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empirical-batter-pitcher-blend
          path: |
            batter_pitcher_blend.log
            half_inning_dp_validation.log
            half_inning_scoring_gate.log
            data/derived/model_calibration/batter_pitcher_blend/
          retention-days: 30
