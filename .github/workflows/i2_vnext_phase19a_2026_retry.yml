name: I2 vNext Phase 19A2 - 2026 YTD replay data

on:
  workflow_dispatch:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase19a_2026_retry.yml'

permissions:
  contents: read

jobs:
  current-2026-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --upgrade pip requests

      - name: Download 2025 Retrosheet prior only
        run: |
          mkdir -p data/raw/i2_vnext/retrosheet
          curl --fail --location --retry 3             "https://www.retrosheet.org/downloads/plays/2025plays.zip"             --output data/raw/i2_vnext/retrosheet/2025plays.zip

      - name: Build 2025 league prior
        run: |
          python src/research/build_i2_prior_league_rates.py             --zip data/raw/i2_vnext/retrosheet/2025plays.zip             --season 2025             --output data/derived/i2_vnext/prior_league_rates_2025.json

      - name: Fetch completed 2026 regular-season feeds
        run: |
          python src/ingestion/fetch_mlb_statsapi_season.py             --start-date 2026-03-01             --end-date 2026-09-27             --output-dir data/raw/i2_vnext/mlbstats_2026             --workers 24

      - name: Build 2026 YTD replay inputs and home-venue spec
        run: |
          python src/research/build_i2_vnext_replay_inputs_mlb.py             --raw-dir data/raw/i2_vnext/mlbstats_2026             --prior-league-rates data/derived/i2_vnext/prior_league_rates_2025.json             --season 2026             --output data/derived/i2_vnext/replay_2026_inputs.json
          python src/research/build_i2_home_venue_spec.py             --inputs data/derived/i2_vnext/replay_2026_inputs.json             --output data/derived/i2_vnext/home_venue_2026.json

      - name: Verify 2026 YTD inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/derived/i2_vnext')
          replay=json.loads((p/'replay_2026_inputs.json').read_text())
          venue=json.loads((p/'home_venue_2026.json').read_text())
          assert replay['season']==2026
          assert replay['market_inputs_used'] is False
          assert replay['games_eligible'] > 2200, replay['games_eligible']
          assert venue['season']==2026
          assert venue['market_inputs_used'] is False
          assert venue['summary']['primary_home_venue_games'] > 2200
          checkpoint={
              'version':'i2-vnext-phase19a-2026-ytd-v2',
              'market_inputs_used':False,
              'cutoff':'2026-09-27',
              'games':replay['games_eligible'],
              'excluded':replay['games_excluded'],
              'primary_home_games':venue['summary']['primary_home_venue_games'],
              'primary_home_share':venue['summary']['primary_home_venue_share'],
              'outcome_source':'MLB Stats API completed regular-season game feeds',
              'prior_league_source':'2025 Retrosheet',
          }
          (p/'PHASE19A_2026_CHECKPOINT.json').write_text(json.dumps(checkpoint,indent=2)+'\n')
          print(json.dumps(checkpoint,indent=2))
          PY

      - name: Upload Phase 19A 2026 YTD data
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase19a-2026
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/replay_2026_inputs.json
            data/derived/i2_vnext/home_venue_2026.json
            data/derived/i2_vnext/prior_league_rates_2025.json
            data/derived/i2_vnext/PHASE19A_2026_CHECKPOINT.json
