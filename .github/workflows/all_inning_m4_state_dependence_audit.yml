name: All-inning M4 state dependence audit

on:
  workflow_dispatch:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - 'src/analysis/all_inning/m4_state_dependence_audit.py'
      - '.github/workflows/all_inning_m4_state_dependence_audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Download M2 pitcher-state artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33451896048
          name: all-inning-m2-pitcher-state-validation-2021-2024
          path: /tmp/m2
      - name: Download M3 batter-path artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: shanecolter1/mlb-model-v6
          run-id: 33460586741
          name: all-inning-m3-batter-path-development-2021-2024
          path: /tmp/m3
      - name: Audit M2-M3 dependence
        run: |
          python src/analysis/all_inning/m4_state_dependence_audit.py \
            --m2 /tmp/m2/m2_pitcher_state_matrix.parquet \
            --m3 /tmp/m3/m3_realized_start_slots.parquet \
            --output-dir /tmp/m4_dependence
      - name: Governance audit
        run: |
          python - <<'PY'
          import json,pandas as pd
          j=json.load(open('/tmp/m4_dependence/manifest.json'))
          s=pd.read_csv('/tmp/m4_dependence/m4_state_dependence_summary.csv')
          assert j['status']=='PASS'
          assert j['development_seasons']==[2021,2022,2023,2024]
          assert j['holdout_opened'] is False
          assert j['market_data_used'] is False
          assert j['smoothing_used'] is False
          assert j['shrinkage_used'] is False
          assert set(s.direction)=={'slot_given_pitcher_state','pitcher_state_given_slot'}
          print(j)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-inning-m4-state-dependence-audit-2021-2024
          path: /tmp/m4_dependence/
          retention-days: 30
