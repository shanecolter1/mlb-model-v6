name: Bullpen development validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/bullpen_*.py'
      - '.github/workflows/bullpen_dev_validation.yml'
  workflow_dispatch:
concurrency:
  group: bullpen-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-bullpen-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scikit-learn
      - name: Build bullpen workload history
        run: python analysis/bullpen_workload_history.py | tee bullpen_workload_history.log
      - name: Build leakage-safe reliever candidate sets
        run: python analysis/bullpen_reliever_candidate_history.py | tee bullpen_reliever_candidates.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullpen-dev-validation-${{ github.sha }}
          path: |
            bullpen_workload_history.log
            bullpen_reliever_candidates.log
            data/derived/model_calibration/bullpen_transitions/bullpen_workload_history_2025.csv
            data/derived/model_calibration/bullpen_transitions/bullpen_workload_summary_2025.json
            data/derived/model_calibration/bullpen_transitions/bullpen_reliever_candidate_sets_2025.csv
            data/derived/model_calibration/bullpen_transitions/bullpen_reliever_candidate_summary_2025.json
          retention-days: 30
