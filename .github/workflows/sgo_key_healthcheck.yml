name: SportsGameOdds key health check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sgo_key_healthcheck.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
    steps:
      - name: Verify secret is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SPORTSGAMEODDS_API_KEY:-}" ]; then
            echo "SPORTSGAMEODDS_API_KEY is missing"
            exit 2
          fi
          echo "SPORTSGAMEODDS_API_KEY is present"

      - name: Verify SportsGameOdds authentication
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.sportsgameodds.com/v2/markets?leagueID=MLB&bookmakerID=draftkings&oddID=points-all-2i-ou-over'
          STATUS="$(curl --silent --show-error --output /tmp/sgo_response.json --write-out '%{http_code}'             --header "accept: application/json"             --header "x-api-key: ${SPORTSGAMEODDS_API_KEY}"             "$URL")"
          echo "SportsGameOdds HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "SportsGameOdds authentication/API check failed"
            head -c 1000 /tmp/sgo_response.json || true
            exit 1
          fi
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/sgo_response.json','utf8')); console.log('SportsGameOdds response parsed successfully'); console.log(JSON.stringify({hasData:Array.isArray(b.data),dataCount:Array.isArray(b.data)?b.data.length:null,nextCursor:b.nextCursor??null},null,2));"
