name: Run I2 daily slate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_daily_run.yml'

permissions:
  contents: read

concurrency:
  group: i2-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-legacy-auto-run:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancelling legacy auto-triggered I2 run; no external APIs are called."
