name: Run I2 daily slate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_daily_run.yml'
      - 'src/market/sportsbook_data_source.mjs'
      - 'src/pipeline/run_i2_today.mjs'
      - 'src/pipeline/run_i2_today_upstream_wrapper.mjs'
      - 'src/pipeline/run_i2_full_slate_override.mjs'
      - 'src/pipeline/run_i2_total_conditioned.mjs'
      - 'src/pipeline/fetch_i2_run_environment.mjs'
      - 'src/pipeline/probe_i2_event_markets.mjs'
      - 'src/pipeline/build_period_markets_reference.mjs'
      - 'src/model/i2_total_conditioning.js'
      - 'data/derived/i2/i2_total_conditioned_prior.json'
      - 'netlify/functions/i2-run-environment.js'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD'
        required: false
      cutoff:
        description: 'ISO-8601 UTC cutoff; games starting after this are included'
        required: false
      trials:
        description: 'Monte Carlo trials per game'
        required: false
        default: '50000'

permissions:
  contents: write

concurrency:
  group: i2-daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-i2-slate:
    runs-on: ubuntu-latest
    env:
      SPORTSBOOK_DATA_SOURCE: THE_ODDS_API
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve run parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          DATE_INPUT='${{ inputs.date }}'
          CUTOFF_INPUT='${{ inputs.cutoff }}'
          TRIALS_INPUT='${{ inputs.trials }}'
          if [ -z "$DATE_INPUT" ]; then DATE_INPUT="$(date -u +%F)"; fi
          if [ -z "$CUTOFF_INPUT" ]; then CUTOFF_INPUT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi
          if [ -z "$TRIALS_INPUT" ]; then TRIALS_INPUT='50000'; fi
          echo "date=$DATE_INPUT" >> "$GITHUB_OUTPUT"
          echo "cutoff=$CUTOFF_INPUT" >> "$GITHUB_OUTPUT"
          echo "trials=$TRIALS_INPUT" >> "$GITHUB_OUTPUT"

      - name: Audit internal venue artifact
        shell: bash
        run: |
          set -euo pipefail
          YEAR="${{ steps.params.outputs.date }}"
          YEAR="${YEAR:0:4}"
          FILE="data/runtime/i2/savant_venue_profiles_${YEAR}_3yr.json"
          if [ -f "$FILE" ]; then
            echo "Using repository venue artifact: $FILE"
          else
            echo "No internal complete venue artifact found; venue remains MISSING/neutral fallback for dimensional continuity."
          fi

      - name: Capture required total-conditioned run environment
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ steps.params.outputs.date }}_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
        shell: bash
        run: |
          set -euo pipefail
          node src/pipeline/fetch_i2_run_environment.mjs

      - name: Run total-conditioned I2 research projections through user upstream first
        env:
          MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_CUTOFF: ${{ steps.params.outputs.cutoff }}
          I2_TRIALS: ${{ steps.params.outputs.trials }}
          I2_OUTPUT: data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json
          I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
          I2_LINEUP_OVERRIDES: data/runtime/i2/${{ steps.params.outputs.date }}_lineup_overrides.json
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ steps.params.outputs.date }}_run_environment.json
          I2_TOTAL_PRIOR: data/derived/i2/i2_total_conditioned_prior.json
        shell: bash
        run: |
          set -euo pipefail
          node src/pipeline/run_i2_total_conditioned.mjs

      - name: Probe post-freeze event-level sportsbook markets
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          I2_OUTPUT: data/runtime/i2/${{ steps.params.outputs.date }}_frozen_predictions.json
          I2_MARKET_CATALOG: data/runtime/i2/${{ steps.params.outputs.date }}_event_market_catalog.json
        shell: bash
        run: |
          set -euo pipefail
          node src/pipeline/probe_i2_event_markets.mjs

      - name: Query Business period markets event-by-event and build reference
        env:
          I2_DATE: ${{ steps.params.outputs.date }}
          PERIOD_RAW: data/runtime/i2/${{ steps.params.outputs.date }}_period_markets_raw.json
          PERIOD_MD: docs/period_markets/${{ steps.params.outputs.date }}_mlb_period_markets.md
          PERIOD_CSV: docs/period_markets/${{ steps.params.outputs.date }}_mlb_period_markets.csv
        shell: bash
        run: |
          set -euo pipefail
          node src/pipeline/build_period_markets_reference.mjs

      - name: Commit prediction and post-freeze market reference artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.params.outputs.date }}"
          ART="data/runtime/i2/${DATE}_frozen_predictions.json"
          ENV_ART="data/runtime/i2/${DATE}_run_environment.json"
          MARKET_ART="data/runtime/i2/${DATE}_event_market_catalog.json"
          PERIOD_RAW="data/runtime/i2/${DATE}_period_markets_raw.json"
          PERIOD_MD="docs/period_markets/${DATE}_mlb_period_markets.md"
          PERIOD_CSV="docs/period_markets/${DATE}_mlb_period_markets.csv"
          TMP="/tmp/i2_frozen_predictions.json"
          ENV_TMP="/tmp/i2_run_environment.json"
          MARKET_TMP="/tmp/i2_event_market_catalog.json"
          PERIOD_RAW_TMP="/tmp/i2_period_markets_raw.json"
          PERIOD_MD_TMP="/tmp/i2_period_markets.md"
          PERIOD_CSV_TMP="/tmp/i2_period_markets.csv"
          cp "$ART" "$TMP"
          cp "$ENV_ART" "$ENV_TMP"
          cp "$MARKET_ART" "$MARKET_TMP"
          cp "$PERIOD_RAW" "$PERIOD_RAW_TMP"
          cp "$PERIOD_MD" "$PERIOD_MD_TMP"
          cp "$PERIOD_CSV" "$PERIOD_CSV_TMP"
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$ART")" "$(dirname "$PERIOD_MD")"
            cp "$TMP" "$ART"
            cp "$ENV_TMP" "$ENV_ART"
            cp "$MARKET_TMP" "$MARKET_ART"
            cp "$PERIOD_RAW_TMP" "$PERIOD_RAW"
            cp "$PERIOD_MD_TMP" "$PERIOD_MD"
            cp "$PERIOD_CSV_TMP" "$PERIOD_CSV"
            git add "$ART" "$ENV_ART" "$MARKET_ART" "$PERIOD_RAW" "$PERIOD_MD" "$PERIOD_CSV"
            if git diff --cached --quiet; then
              echo 'No prediction or market-reference changes.'
              exit 0
            fi
            git commit -m "Update I2 projections and period markets reference ${DATE}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; refreshing main and retrying."
          done

          echo 'Unable to push I2 artifacts after 3 attempts.'
          exit 1

