name: I2 parent-like continuous total experiment

on:
  push:
    branches:
      - research/i2-v0.4-local-cv-production
    paths:
      - 'src/analysis/i2_parentlike_continuous_total.py'
      - '.github/workflows/i2_parentlike_continuous_total.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen Phase 1 historical store
        run: |
          mkdir -p /tmp/phase1
          gh release download i2-phase1-historical-store-v1 -p 'i2-phase1-frozen-historical-store-2021-2025.tar.gz' -D /tmp/phase1
          mkdir -p /tmp/phase1/ex
          tar -xzf /tmp/phase1/i2-phase1-frozen-historical-store-2021-2025.tar.gz -C /tmp/phase1/ex
      - name: Download v0.4 validation predictions
        run: |
          mkdir -p /tmp/v04
          gh release download i2-v0.4-production-validation-v1 -p '*.tar.gz' -D /tmp/v04
          mkdir -p /tmp/v04/ex
          tar -xzf /tmp/v04/*.tar.gz -C /tmp/v04/ex
      - name: Run experiment
        run: |
          python -m pip install --quiet pandas numpy pyarrow scipy
          python src/analysis/i2_parentlike_continuous_total.py --phase1 /tmp/phase1/ex --v04 /tmp/v04/ex --out /tmp/out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2-parentlike-continuous-total
          path: /tmp/out/
