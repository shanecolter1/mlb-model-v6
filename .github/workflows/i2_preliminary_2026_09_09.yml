name: Run preliminary I2 slate 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_preliminary_2026_09_09.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i2-preliminary-2026-09-09
  cancel-in-progress: true

jobs:
  run-preliminary-slate:
    runs-on: ubuntu-latest
    env:
      I2_DATE: '2026-09-09'
      SPORTSBOOK_DATA_SOURCE: THE_ODDS_API
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build preliminary batting orders
        env:
          I2_LINEUP_OVERRIDES: data/runtime/i2/2026-09-09_lineup_overrides.json
          I2_PRELIM_LOOKBACK_DAYS: '7'
        run: node src/pipeline/build_preliminary_lineups_from_last_game.mjs

      - name: Add corroborated probable-starter fallbacks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/runtime/i2/2026-09-09_lineup_overrides.json';
          const out = JSON.parse(fs.readFileSync(path, 'utf8'));
          const setStarter = (gamePk, side, name, source, note) => {
            const game = out.games[String(gamePk)];
            if (!game) throw new Error(`Missing game ${gamePk} in lineup artifact`);
            game[`${side}Starter`] = { name, source, role: 'probable starter', note };
          };
          setStarter(823172, 'away', 'Andre Pallante', 'ESPN + FantasyPros', 'Corroborated preliminary fallback; MLB listed St. Louis starter as TBD at capture.');
          setStarter(823090, 'away', 'Cal Quantrill', 'ESPN + FantasyPros', 'Corroborated preliminary fallback; MLB listed Texas starter as TBD at capture.');
          setStarter(823090, 'home', 'Kade Anderson', 'ESPN + FantasyPros', 'Corroborated preliminary fallback; MLB listed Seattle starter as TBD at capture.');
          setStarter(824871, 'home', 'Reynaldo Lopez', 'RotoWire citing Atlanta Journal-Constitution', 'Reported return from the injured list to start Wednesday; MLB listed Atlanta starter as TBD at capture.');
          out.governance.probableStarterFallbacks = {
            sourceStatus: 'PROVISIONAL_CORROBORATED_PUBLIC_FALLBACK',
            capturedForDate: '2026-09-09',
            unresolvedGamesPreservedAsPending: [824956, 824064, 824549],
            note: 'No starter was forced where sources were TBD, injured, or materially conflicting.'
          };
          fs.writeFileSync(path, JSON.stringify(out, null, 2));
          NODE

      - name: Capture isolated DraftKings full-game totals
        env:
          I2_RUN_ENVIRONMENT: data/runtime/i2/2026-09-09_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
          I2_RUN_ENVIRONMENT_RETRY_MS: '5000'
        run: node src/pipeline/fetch_i2_run_environment.mjs

      - name: Run 50,000-trial parent model
        env:
          MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
          I2_CUTOFF: '1970-01-01T00:00:00Z'
          I2_TRIALS: '50000'
          I2_OUTPUT: data/runtime/i2/2026-09-09_v04_parent_predictions.json
          I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
          I2_LINEUP_OVERRIDES: data/runtime/i2/2026-09-09_lineup_overrides.json
          I2_RUN_ENVIRONMENT: data/runtime/i2/2026-09-09_run_environment.json
          I2_TOTAL_PRIOR: data/derived/i2/i2_total_conditioned_prior.json
        run: node src/pipeline/run_i2_total_conditioned.mjs

      - name: Apply promoted v0.4 Local-CV calibration
        env:
          I2_INPUT: data/runtime/i2/2026-09-09_v04_parent_predictions.json
          I2_OUTPUT: data/runtime/i2/2026-09-09_v04_predictions.json
        run: node src/pipeline/apply_i2_v04_local_cv.mjs

      - name: Write complete preliminary summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const d = '2026-09-09';
          const out = JSON.parse(fs.readFileSync(`data/runtime/i2/${d}_v04_predictions.json`, 'utf8'));
          const gate = 61.5;
          const ranking = (out.ranking || []).map(r => ({
            rank: r.rank,
            gamePk: r.gamePk,
            matchup: r.matchup,
            gameDate: r.gameDate,
            awayStarter: r.awayStarter,
            homeStarter: r.homeStarter,
            total: r.runEnvironment?.fullGameTotal ?? null,
            under05Pct: r.under05Pct,
            over05Pct: r.over05Pct,
            fairUnder: r.fairUnder,
            fairOver: r.fairOver,
            top2ScorePct: r.top2ScorePct,
            bottom2ScorePct: r.bottom2ScorePct,
            predictionClass: r.predictionClass || null,
            lineupSource: r.lineupSource || null,
            probableStarterFallbacks: r.probableStarterFallbacks || null,
            underQualified: Number(r.under05Pct) >= gate
          }));
          const ranked = new Set(ranking.map(r => String(r.gamePk)));
          const pending = (out.games || []).filter(g => !ranked.has(String(g.gamePk))).map(g => ({
            gamePk: g.gamePk,
            matchup: `${g.away} @ ${g.home}`,
            gameDate: g.gameDate,
            awayStarter: g.awayStarter,
            homeStarter: g.homeStarter,
            status: g.modelStatus,
            runEnvironment: g.runEnvironment || null
          }));
          const summary = {
            date: d,
            model: out.model,
            generatedAt: new Date().toISOString(),
            trialsPerProjectedGame: 50000,
            underThresholdPct: gate,
            scheduledGames: (out.games || []).length,
            projectedGames: ranking.length,
            pendingGames: pending.length,
            qualifiedUnders: ranking.filter(r => r.underQualified),
            ranking,
            pending
          };
          fs.writeFileSync(`data/runtime/i2/${d}_v04_summary.json`, JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit immutable preliminary artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add \
            data/runtime/i2/2026-09-09_lineup_overrides.json \
            data/runtime/i2/2026-09-09_run_environment.json \
            data/runtime/i2/2026-09-09_v04_parent_predictions.json \
            data/runtime/i2/2026-09-09_v04_predictions.json \
            data/runtime/i2/2026-09-09_v04_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Run preliminary I2 v0.4 slate 2026-09-09'
          git push origin HEAD:main
