name: FanDuel I2 EV 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fanduel_i2_ev_2026_09_05.yml'

permissions:
  contents: write

jobs:
  pull-fanduel-i2:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull FanDuel second-inning markets and compute EV from reconciled shadow board
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const date='2026-09-05';
          const probs={
            'Tampa Bay Rays @ Texas Rangers':{u:.6713,o:.3287},
            'Washington Nationals @ Los Angeles Dodgers':{u:.6495,o:.3505},
            'Detroit Tigers @ Cleveland Guardians':{u:.6456,o:.3544},
            'New York Yankees @ San Diego Padres':{u:.5850,o:.4150},
            'San Francisco Giants @ New York Mets':{u:.5796,o:.4204},
            'Los Angeles Angels @ Pittsburgh Pirates':{u:.5769,o:.4231},
            'Boston Red Sox @ Baltimore Orioles':{u:.5658,o:.4342},
            'Atlanta Braves @ Philadelphia Phillies':{u:.5636,o:.4364},
            'Minnesota Twins @ Chicago White Sox':{u:.5566,o:.4434},
            'Chicago Cubs @ Miami Marlins':{u:.5541,o:.4459},
            'Arizona Diamondbacks @ Houston Astros':{u:.5456,o:.4544},
            'Athletics @ Seattle Mariners':{u:.5442,o:.4558},
            'Milwaukee Brewers @ Cincinnati Reds':{u:.5432,o:.4568},
            'Toronto Blue Jays @ Kansas City Royals':{u:.5011,o:.4989},
            'St. Louis Cardinals @ Colorado Rockies':{u:.4381,o:.5619}
          };
          const empiricalStatus={
            'Athletics @ Seattle Mariners':'MATCHUP_DELTA_OUTSIDE_HISTORICAL_I2_95CI'
          };
          const key=process.env.ODDS_API_KEY;
          if(!key) throw new Error('ODDS_API_KEY missing');
          async function get(path,params){
            const u=new URL(path,'https://api.theoddsapi.com');
            for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));
            const r=await fetch(u,{headers:{'x-api-key':key,accept:'application/json'}});
            const t=await r.text();
            if(!r.ok)throw new Error(`${r.status} ${t}`);
            return JSON.parse(t);
          }
          function dec(a){return a>0?1+a/100:1+100/Math.abs(a)}
          function be(a){return a>0?100/(a+100):Math.abs(a)/(Math.abs(a)+100)}
          function ev(p,a){return p*(dec(a)-1)-(1-p)}
          const eventsResp=await get('/odds/',{sport_key:'baseball_mlb',markets:'h2h',commenceTimeFrom:'2026-09-05T00:00:00Z',commenceTimeTo:'2026-09-06T06:00:00Z'});
          const events=Array.isArray(eventsResp.data)?eventsResp.data:[];
          const out=[];
          for(const e of events){
            let resp;
            try{resp=await get('/period-markets/',{sport_key:'baseball_mlb',event_id:e.event_id});}catch(err){out.push({matchup:`${e.away_team} @ ${e.home_team}`,error:String(err)});continue;}
            const items=Array.isArray(resp.data)?resp.data:[resp.data].filter(Boolean);
            for(const item of items){
              for(const m of item.markets||[]){
                const marketName=String(m.market||'');
                for(const b of m.books||[]){
                  if(!/fanduel/i.test(String(b.book||'')))continue;
                  const matchup=`${item.away_team||e.away_team} @ ${item.home_team||e.home_team}`;
                  const pr=probs[matchup];
                  for(const o of b.outcomes||[]){
                    out.push({matchup,market:marketName,book:b.book,updated_at:b.updated_at||null,outcome:o.name,point:o.point??null,price:o.price??null,modelProb:pr?(/under/i.test(String(o.name))?pr.u:/over/i.test(String(o.name))?pr.o:null):null,empiricalReconciliationStatus:empiricalStatus[matchup]||'CONSISTENT_WITH_HISTORICAL_I2_95CI'});
                  }
                }
              }
            }
          }
          const second=out.filter(r=>!r.error && /(?:2|second)/i.test(String(r.market)) && /inning/i.test(String(r.market)));
          for(const r of second){if(Number.isFinite(Number(r.price))&&r.modelProb!=null){r.breakEven=be(Number(r.price));r.edge=r.modelProb-r.breakEven;r.ev=ev(r.modelProb,Number(r.price));}}
          const payload={date,generatedAt:new Date().toISOString(),sourceProjection:'data/runtime/i2/2026-09-05_preliminary_full_workflow_shadow.json',source:'The Odds API Business period-markets',book:'FanDuel',marketStage:'POST_PROJECTION_SHADOW_EV',probabilitiesFrozenBeforeMarketPull:true,allFanDuelRows:out,secondInningRows:second};
          fs.mkdirSync('data/runtime/i2',{recursive:true});
          fs.writeFileSync('data/runtime/i2/2026-09-05_fanduel_i2_ev.json',JSON.stringify(payload,null,2));
          console.log(JSON.stringify(second,null,2));
          NODE
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          ART=data/runtime/i2/2026-09-05_fanduel_i2_ev.json
          cp "$ART" /tmp/fd.json
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          for x in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fd.json "$ART"
            git add "$ART"
            git commit -m "Capture FanDuel I2 EV 2026-09-05" || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1
