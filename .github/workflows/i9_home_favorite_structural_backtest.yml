name: I9 home favorite structural backtest

on:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - 'src/analysis/i9_home_favorite_structural_backtest.py'
      - '.github/workflows/i9_home_favorite_structural_backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-inning-engine-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python src/analysis/i9_home_favorite_structural_backtest.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/I9_HOME_FAVORITE_STRUCTURAL_BACKTEST_2021_2025.md data/derived/all_inning/i9_home_favorite_structural_backtest_2021_2025.csv data/derived/all_inning/i9_home_favorite_disjoint_tiers_2021_2025.csv
          git diff --cached --quiet || git commit -m 'Add I9 home-favorite structural backtest results'
          git push
