name: Bullpen removal hazard validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/fit_bullpen_removal_hazard.py'
      - '.github/workflows/bullpen_removal_hazard.yml'
  workflow_dispatch:
concurrency:
  group: bullpen-removal-hazard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fit-removal-hazard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: empirical-batter-pitcher-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scikit-learn
      - name: Restore persisted bullpen history artifact
        uses: actions/download-artifact@v4
        with:
          name: bullpen-transition-history-1a2a51f345b995df15ef24f6bb417f8223a535b3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32676763749
          path: .history
      - name: Restore history dataset
        shell: bash
        run: |
          mkdir -p data/derived/model_calibration/bullpen_transitions
          cp -R .history/data/derived/model_calibration/bullpen_transitions/. data/derived/model_calibration/bullpen_transitions/ 2>/dev/null || cp -R .history/. data/derived/model_calibration/bullpen_transitions/
      - name: Fit and validate in-inning removal hazard
        shell: bash
        run: |
          set -euo pipefail
          python analysis/fit_bullpen_removal_hazard.py | tee bullpen_removal_hazard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullpen-removal-hazard-${{ github.sha }}
          path: |
            bullpen_removal_hazard.log
            data/derived/model_calibration/bullpen_transitions/removal_hazard/in_inning_removal_hazard_validation.json
            data/derived/model_calibration/bullpen_transitions/removal_hazard/in_inning_removal_hazard_model.pkl
          retention-days: 30
