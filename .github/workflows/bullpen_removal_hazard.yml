name: Bullpen removal hazard validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/bullpen_transition_history.py'
      - 'analysis/fit_bullpen_removal_hazard.py'
      - '.github/workflows/bullpen_removal_hazard.yml'
  workflow_dispatch:
concurrency:
  group: bullpen-removal-hazard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fit-removal-hazard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: empirical-batter-pitcher-blend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy scikit-learn
      - name: Build corrected in-inning bullpen history
        shell: bash
        run: |
          set -euo pipefail
          python analysis/bullpen_transition_history.py | tee bullpen_transition_history.log
      - name: Fit and validate corrected in-inning removal hazard
        shell: bash
        run: |
          set -euo pipefail
          python analysis/fit_bullpen_removal_hazard.py | tee bullpen_removal_hazard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullpen-removal-hazard-${{ github.sha }}
          path: |
            bullpen_transition_history.log
            bullpen_removal_hazard.log
            data/derived/model_calibration/bullpen_transitions/bullpen_transition_pa_boundaries_2025.csv
            data/derived/model_calibration/bullpen_transitions/bullpen_transition_summary_2025.json
            data/derived/model_calibration/bullpen_transitions/removal_hazard/in_inning_removal_hazard_validation.json
            data/derived/model_calibration/bullpen_transitions/removal_hazard/in_inning_removal_hazard_model.pkl
          retention-days: 30
