name: I2 vNext Phase 4B - replay only

on:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase4b_replay_only.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: i2-vnext-phase4b-only
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact successful phase 4A artifact
        uses: actions/download-artifact@v4
        with:
          name: i2-vnext-phase4a-prepared
          path: data/derived/i2_vnext
          run-id: 36277361322
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify prepared artifact identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/derived/i2_vnext/phase4a_prepare_checkpoint.json').read_text())
          assert p['version']=='i2-vnext-phase4a-prepared-v1'
          assert p['season']==2025
          assert p['market_inputs_used'] is False
          assert p['games']==2430
          assert p['i1_player_asof_model']['status']=='SELECTED_BY_2024_OOS_AB'
          assert p['walkforward_manifest']['market_inputs_used'] is False
          assert len(p['walkforward_manifest']['entries'])==6
          print(json.dumps({
            'games':p['games'],
            'i1_status':p['i1_player_asof_model']['status'],
            'walkforward_entries':len(p['walkforward_manifest']['entries']),
          },indent=2))
          PY
          node --check src/research/run_i2_vnext_replay.mjs

      - name: Run untouched 2025 full-I2 replay
        run: |
          node src/research/run_i2_vnext_replay.mjs             --trials 2500             --i1-mode player_asof             --input data/derived/i2_vnext/replay_2025_inputs_player_asof.json             --model data/derived/i2_vnext/i2_vnext_event_model.json             --walkforward-manifest data/derived/i2_vnext/walkforward_2025/manifest.json             --arsenal data/derived/i2_vnext/arsenal_profile_2024.json             --parks data/derived/i2_vnext/park/savant_venue_profiles_2024_3yr.json             --play-calibration data/derived/model_calibration/seasonal/production_pa_transition_table_shrunk.json             --output data/derived/i2_vnext/replay_2025_predictions.json

      - name: Verify and summarize replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('data/derived/i2_vnext/replay_2025_predictions.json').read_text())
          assert m['season']==2025
          assert m['market_inputs_used'] is False
          assert m['observed_i2_state_used_as_predictor'] is False
          assert m['point_in_time_player_refits'] is True
          assert m['walkforward_policy']['point_in_time'] is True
          assert m['i1_state_mode']=='player_asof'
          assert m['i1_state_model']['player_specific_i1_talent_used'] is True
          assert m['i1_player_asof_model']['market_inputs_used'] is False
          assert m['n']==2430
          checkpoint={
              'version':'i2-vnext-phase4-replay-checkpoint-v1',
              'season':2025,
              'market_inputs_used':False,
              'n':m['n'],
              'raw_brier':m['raw_brier'],
              'raw_logloss':m['raw_logloss'],
              'park_match_rate':m['park_match_rate'],
              'trials_per_game':m['trials_per_game'],
              'i1_state_mode':m['i1_state_mode'],
              'point_in_time_player_refits':m['point_in_time_player_refits'],
              'walkforward_policy':m['walkforward_policy'],
          }
          Path('data/derived/i2_vnext/phase4_replay_checkpoint.json').write_text(
              json.dumps(checkpoint,indent=2)
          )
          print('PHASE4_RESULT='+json.dumps(checkpoint,separators=(',',':')))
          PY

      - name: Upload durable phase 4B result
        uses: actions/upload-artifact@v4
        with:
          name: i2-vnext-phase4b-replay-2025
          if-no-files-found: error
          retention-days: 14
          path: |
            data/derived/i2_vnext/replay_2025_predictions.json
            data/derived/i2_vnext/phase4_replay_checkpoint.json
