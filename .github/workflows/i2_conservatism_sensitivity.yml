name: I2 conservatism sensitivity

on:
  push:
    branches:
      - research/all-inning-engine-rebuild
    paths:
      - src/analysis/i2_conservatism_sensitivity.py
      - .github/workflows/i2_conservatism_sensitivity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-inning-engine-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Download permanent Phase 1 frozen store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/phase1
          gh release download i2-phase1-historical-store-v1 --dir /tmp/phase1 --pattern 'i2-phase1-frozen-historical-store-2021-2025.tar.gz' --clobber
          tar -C /tmp -xzf /tmp/phase1/i2-phase1-frozen-historical-store-2021-2025.tar.gz

      - name: Define sensitivity variants
        run: |
          cat > /tmp/variants.json <<'JSON'
          [
            {"name":"current_p100_r10","prior_strength":100,"ridge_lambda":10},
            {"name":"prior0_r10","prior_strength":0,"ridge_lambda":10},
            {"name":"prior25_r10","prior_strength":25,"ridge_lambda":10},
            {"name":"prior50_r10","prior_strength":50,"ridge_lambda":10},
            {"name":"prior200_r10","prior_strength":200,"ridge_lambda":10},
            {"name":"p100_r1","prior_strength":100,"ridge_lambda":1},
            {"name":"p100_r5","prior_strength":100,"ridge_lambda":5},
            {"name":"p100_r25","prior_strength":100,"ridge_lambda":25},
            {"name":"least_shrunk_p0_r1","prior_strength":0,"ridge_lambda":1}
          ]
          JSON

      - name: Run chronological OOS replay variants
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          variants=json.loads(Path('/tmp/variants.json').read_text())
          root=Path('/tmp/i2_conservatism_variants'); root.mkdir(parents=True,exist_ok=True)
          for v in variants:
              out=root/v['name']
              cmd=[
                'python','src/analysis/i2_strict_asof_replay_canonical_codes.py',
                '--master','/tmp/i2_phase1_store/canonical/MLB_Game_Stats_Joined_2021_2025.csv.gz',
                '--games','/tmp/i2_phase1_store/mlb_2021_2025/games.parquet',
                '--team-asof','/tmp/i2_phase1_store/team_asof.parquet',
                '--output-dir',str(out),
                '--prior-strength',str(v['prior_strength']),
                '--ridge-lambda',str(v['ridge_lambda'])
              ]
              print('RUN',v)
              subprocess.run(cmd,check=True)
          PY

      - name: Summarize probability compression
        run: |
          python src/analysis/i2_conservatism_sensitivity.py \
            --variants-dir /tmp/i2_conservatism_variants \
            --manifest /tmp/variants.json \
            --output-dir /tmp/i2_conservatism_analysis

      - name: Freeze outputs
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/i2_conservatism_analysis')
          files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): files.append({'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'frozen_manifest.json').write_text(json.dumps({'status':'FROZEN','analysis':'i2_conservatism_sensitivity','price_used':False,'files':files},indent=2)+'\n')
          PY
          tar -C /tmp -czf /tmp/i2-conservatism-sensitivity-v1.tar.gz i2_conservatism_analysis
          sha256sum /tmp/i2-conservatism-sensitivity-v1.tar.gz > /tmp/i2-conservatism-sensitivity-v1.sha256

      - name: Publish permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="i2-conservatism-sensitivity-v1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "I2 conservatism sensitivity v1" --notes "Price-blind chronological OOS sensitivity analysis of total-prior shrinkage and ridge regularization in the strict I2 replay."
          gh release upload "$TAG" /tmp/i2-conservatism-sensitivity-v1.tar.gz /tmp/i2-conservatism-sensitivity-v1.sha256 --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: i2-conservatism-sensitivity-v1
          path: |
            /tmp/i2-conservatism-sensitivity-v1.tar.gz
            /tmp/i2-conservatism-sensitivity-v1.sha256
          retention-days: 90
