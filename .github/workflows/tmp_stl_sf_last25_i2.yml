name: Temporary STL SF last25 I2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp_stl_sf_last25_i2.yml']
permissions:
  contents: write
jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate last 25 offense I2 under rates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          async function j(u){const r=await fetch(u,{headers:{accept:'application/json','user-agent':'MLB-I2-Last25/1.0'}}); if(!r.ok) throw new Error(`${r.status} ${u}`); return r.json();}
          async function calc(teamId,name){
            const s=await j(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}&startDate=2026-07-25&endDate=2026-09-06&gameTypes=R`);
            const gs=(s.dates||[]).flatMap(d=>d.games||[]).filter(g=>String(g.status?.abstractGameState||'').toLowerCase()==='final').sort((a,b)=>Date.parse(b.gameDate)-Date.parse(a.gameDate)).slice(0,25);
            let scoreless=0, scored=0; const games=[];
            for(const g of gs){
              const f=await j(`https://statsapi.mlb.com/api/v1.1/game/${g.gamePk}/feed/live`);
              const inn=(f.liveData?.linescore?.innings||[]).find(x=>Number(x.num)===2);
              const awayId=f.gameData?.teams?.away?.id; const side=Number(awayId)===Number(teamId)?'away':'home';
              const runs=Number(inn?.[side]?.runs||0); if(runs===0) scoreless++; else scored++;
              games.push({gamePk:g.gamePk,gameDate:g.gameDate,side,runs});
            }
            return {teamId,name,games:gs.length,scoreless,scored,i2UnderPct:scoreless/gs.length*100,detail:games};
          }
          const out={through:'2026-09-06',teams:[await calc(138,'St. Louis Cardinals'),await calc(137,'San Francisco Giants')]};
          fs.mkdirSync('data/runtime/i2',{recursive:true});
          fs.writeFileSync('data/runtime/i2/tmp_stl_sf_last25_i2.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/i2/tmp_stl_sf_last25_i2.json
          git commit -m "Temporary STL SF last25 I2 calculation" || exit 0
          git push
