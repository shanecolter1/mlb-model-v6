name: Manual governed I2 evaluation 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_manual_eval_2026_08_21.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run governing v0.3 workflow and capture diagnostics
        shell: bash
        env:
          MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
          I2_DATE: '2026-08-21'
          I2_TRIALS: '50000'
          I2_OUTPUT: data/runtime/i2/2026-08-21_frozen_predictions.json
          I2_VENUE_PROFILES: data/runtime/i2/savant_venue_profiles_2026_3yr.json
          I2_LINEUP_OVERRIDES: data/runtime/i2/2026-08-21_lineup_overrides.json
          I2_RUN_ENVIRONMENT: data/runtime/i2/2026-08-21_run_environment.json
          I2_TOTAL_PRIOR: data/derived/i2/i2_total_conditioned_prior.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
          I2_RUN_ENVIRONMENT_RETRY_MS: '5000'
        run: |
          set +e
          mkdir -p data/runtime/i2
          LOG=data/runtime/i2/2026-08-21_manual_eval.log
          : > "$LOG"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"
          export I2_CUTOFF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "cutoff=$I2_CUTOFF" | tee -a "$LOG"

          YEAR=2026
          VENUE="data/runtime/i2/savant_venue_profiles_${YEAR}_3yr.json"
          if [ -f "$VENUE" ]; then
            echo "venue_artifact=present:$VENUE" | tee -a "$LOG"
          else
            echo "venue_artifact=missing_neutral_fallback" | tee -a "$LOG"
          fi

          echo "STEP fetch_i2_run_environment" | tee -a "$LOG"
          node src/pipeline/fetch_i2_run_environment.mjs >> "$LOG" 2>&1
          ENV_RC=$?
          echo "fetch_i2_run_environment_rc=$ENV_RC" | tee -a "$LOG"

          MODEL_RC=99
          if [ "$ENV_RC" -eq 0 ]; then
            echo "STEP run_i2_total_conditioned" | tee -a "$LOG"
            node src/pipeline/run_i2_total_conditioned.mjs >> "$LOG" 2>&1
            MODEL_RC=$?
            echo "run_i2_total_conditioned_rc=$MODEL_RC" | tee -a "$LOG"
          else
            echo "model_skipped_due_to_run_environment_failure" | tee -a "$LOG"
          fi

          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$LOG"
          echo "env_rc=$ENV_RC model_rc=$MODEL_RC" | tee -a "$LOG"

      - name: Commit evaluation artifacts and diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          # The prior step's files survive reset only if copied first, so reconstruct from workspace temp if present.
          # GitHub Actions reset occurs in-place; stash untracked runtime files before reset.
        continue-on-error: true

      - name: Commit without resetting generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/i2/2026-08-21_manual_eval.log
          if [ -f data/runtime/i2/2026-08-21_run_environment.json ]; then git add data/runtime/i2/2026-08-21_run_environment.json; fi
          if [ -f data/runtime/i2/2026-08-21_frozen_predictions.json ]; then git add data/runtime/i2/2026-08-21_frozen_predictions.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run governed I2 evaluation 2026-08-21"
          git push origin HEAD:main
