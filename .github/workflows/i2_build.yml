name: Build I2 state datasets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_build.yml'
      - 'src/ingestion/build_i2_state_transitions.py'
      - 'src/ingestion/build_i2_play_calibration.py'
      - 'src/model/i2_inning_model.js'
      - 'tests/i2_inning_model.test.mjs'
      - 'src/event_probability_engine.js'
      - 'src/model/seeded_random.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-i2-state-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test I2 probability engine
        run: node tests/i2_inning_model.test.mjs

      - name: Download Retrosheet season CSV packages
        run: |
          set -euo pipefail
          mkdir -p data/raw/retrosheet_i2
          for year in 2021 2022 2023 2024 2025; do
            curl --fail --location --retry 3 \
              "https://www.retrosheet.org/downloads/${year}/${year}csvs.zip" \
              --output "data/raw/retrosheet_i2/${year}csvs.zip"
          done

      - name: Build I1 to I2 state-transition datasets
        run: |
          python src/ingestion/build_i2_state_transitions.py \
            --input-dir data/raw/retrosheet_i2 \
            --output-dir data/derived/i2

      - name: Build empirical play and pitch-count calibration
        run: |
          python src/ingestion/build_i2_play_calibration.py \
            --input-dir data/raw/retrosheet_i2 \
            --output data/derived/i2/i2_play_calibration.json \
            --summary data/derived/i2/i2_play_calibration_summary.csv

      - name: Verify expected outputs
        run: |
          set -euo pipefail
          test -f data/derived/i2/i2_state_compact_2021.csv
          test -f data/derived/i2/i2_state_compact_2025.csv
          test -f data/derived/i2/i2_state_benchmark.csv
          test -f data/derived/i2/i2_play_calibration.json
          python - <<'PY'
          import csv, glob, json
          rows = 0
          for path in glob.glob('data/derived/i2/i2_state_compact_20*.csv'):
              with open(path, newline='', encoding='utf-8') as f:
                  rows += sum(1 for _ in csv.DictReader(f))
          assert rows == 24296, rows
          with open('data/derived/i2/i2_state_manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['regular_season_games'] == 12148
          assert manifest['i2_start_slot_missing'] == 0
          with open('data/derived/i2/i2_play_calibration.json', encoding='utf-8') as f:
              calibration = json.load(f)
          assert calibration['regular_season_plate_appearances'] == 913349
          assert calibration['base_transition_states'] == 192
          print({
              'state_rows': rows,
              'games': manifest['regular_season_games'],
              'calibration_pa': calibration['regular_season_plate_appearances'],
              'transition_states': calibration['base_transition_states'],
          })
          PY

      - name: Commit derived datasets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2
          if git diff --cached --quiet; then
            echo "No I2 dataset changes to commit."
            exit 0
          fi
          git commit -m "Build I2 calibrated state datasets"
          git push
