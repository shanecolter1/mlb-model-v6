name: I2 preliminary fast 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_preliminary_fast_2026_09_05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fast-preliminary:
    runs-on: ubuntu-latest
    env:
      DATE: '2026-09-05'
      MLB_OTHER_MODEL_BASE_URL: https://lambent-brioche-ca05b1.netlify.app
      SPORTSBOOK_DATA_SOURCE: THE_ODDS_API
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SAMPLE_COUNT: '8'
      I2_TRIALS: '8000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build fast probabilistic lineup samples
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime, math, random, os
          from collections import defaultdict
          DATE=os.environ['DATE']; N=int(os.environ['SAMPLE_COUNT']); target=datetime.date.fromisoformat(DATE); random.seed(9052026)
          UA='MLB-I2-Fast-Prelim/1.0'
          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':UA})
              with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          def sched(**p):return get('https://statsapi.mlb.com/api/v1/schedule?'+urllib.parse.urlencode(p))
          today=sched(sportId=1,date=DATE,hydrate='probablePitcher,team')
          games=[g for d in today.get('dates',[]) for g in d.get('games',[])]
          def hand(pid):
              if not pid:return None
              return ((get(f'https://statsapi.mlb.com/api/v1/people/{pid}').get('people',[{}])[0].get('pitchHand') or {}).get('code'))
          def roster(tid):
              return {int(x['person']['id']):x['person']['fullName'] for x in get(f'https://statsapi.mlb.com/api/v1/teams/{tid}/roster?rosterType=active&date={DATE}').get('roster',[]) if x.get('person',{}).get('id')}
          def hist(tid,active,target_hand):
              s=sched(sportId=1,teamId=tid,startDate=(target-datetime.timedelta(days=9)).isoformat(),endDate=(target-datetime.timedelta(days=1)).isoformat(),gameType='R')
              gs=[g for d in s.get('dates',[]) for g in d.get('games',[])]; gs.sort(key=lambda x:x.get('gameDate',''),reverse=True); gs=gs[:5]
              ss=defaultdict(lambda:defaultdict(float)); ov=defaultdict(float); used=[]
              for idx,g in enumerate(gs):
                  try:f=get(f"https://statsapi.mlb.com/api/v1.1/game/{g['gamePk']}/feed/live")
                  except:continue
                  gd=f.get('gameData',{}); bx=f.get('liveData',{}).get('boxscore',{}).get('teams',{})
                  side='home' if (gd.get('teams',{}).get('home') or {}).get('id')==tid else 'away'; opp='away' if side=='home' else 'home'
                  rows=[]
                  for p in (bx.get(side,{}) or {}).get('players',{}).values():
                      bo=p.get('battingOrder')
                      if not bo:continue
                      try:sl=int(bo)//100
                      except:continue
                      pid=(p.get('person') or {}).get('id')
                      if sl in range(1,10) and pid:rows.append((sl,int(pid)))
                  if len(rows)!=9:continue
                  op=(bx.get(opp,{}) or {}).get('pitchers') or []; oh=None
                  if op: oh=((gd.get('players',{}).get(f'ID{op[0]}',{}) or {}).get('pitchHand') or {}).get('code')
                  w=math.exp(-0.35*idx)*(1.8 if target_hand and oh==target_hand else 1)
                  for sl,pid in rows:
                      if pid in active:ss[pid][sl]+=w;ov[pid]+=w
                  used.append({'gamePk':g['gamePk'],'oppHand':oh,'weight':w})
              return ss,ov,used
          teams={}; meta={}
          for g in games:
              gp=str(g['gamePk']); a=g['teams']['away']['team']; h=g['teams']['home']['team']; ap=g['teams']['away'].get('probablePitcher') or {}; hp=g['teams']['home'].get('probablePitcher') or {}; ah=hand(ap.get('id'));hh=hand(hp.get('id'))
              meta[gp]={'away':a,'home':h,'awayStarter':ap,'homeStarter':hp,'awayStarterHand':ah,'homeStarterHand':hh,'gameDate':g.get('gameDate')}
              for t,opp_h in ((a,hh),(h,ah)):
                  tid=int(t['id'])
                  if tid not in teams:
                      act=roster(tid); ss,ov,used=hist(tid,act,opp_h); teams[tid]={'team':t,'active':act,'ss':ss,'ov':ov,'used':used,'oppHand':opp_h}
          def pick(items,w):
              s=sum(w); r=random.random()*s if s>0 else 0; c=0
              for i,x in enumerate(items):
                  c+=w[i]
                  if c>=r:return x
              return items[-1]
          def lineup(t):
              elig=[p for p in t['ov'] if p in t['active'] and t['ov'][p]>0]
              if len(elig)<9:
                  raise RuntimeError(f"{t['team']['name']} only {len(elig)} eligible hitters")
              out=[];used=set()
              for sl in range(1,10):
                  cand=[p for p in elig if p not in used]; w=[t['ss'][p].get(sl,0)+.05*t['ov'][p] for p in cand]; p=pick(cand,w); used.add(p);out.append(t['active'][p])
              return out
          os.makedirs(f'data/runtime/i2/{DATE}_fast_overrides',exist_ok=True)
          for n in range(1,N+1):
              o={'governance':{'sourceStatus':'PRELIMINARY_FAST_PROBABILISTIC_MLB_HISTORY','note':'8-sample shadow run from last 5 complete official MLB lineups, exact-date active roster, recency and opposing-starter-hand weighted.'},'games':{}}
              for gp,m in meta.items():o['games'][gp]={'matchup':f"{m['away']['name']} @ {m['home']['name']}",'away':lineup(teams[int(m['away']['id'])]),'home':lineup(teams[int(m['home']['id'])])}
              json.dump(o,open(f'data/runtime/i2/{DATE}_fast_overrides/sample_{n:02d}.json','w'),indent=2)
          audit={'date':DATE,'method':'last 5 complete official MLB lineups; exact-date active roster; recency exp(-0.35*index); same starter hand x1.8; slot sample without replacement','games':meta,'teams':{str(k):{'team':v['team'],'oppHand':v['oppHand'],'history':v['used']} for k,v in teams.items()}}
          json.dump(audit,open(f'data/runtime/i2/{DATE}_fast_lineup_audit.json','w'),indent=2)
          print({'games':len(games),'teams':len(teams),'samples':N})
          PY

      - name: Capture full-game-total point
        env:
          I2_DATE: ${{ env.DATE }}
          I2_RUN_ENVIRONMENT: data/runtime/i2/${{ env.DATE }}_fast_run_environment.json
          I2_RUN_ENVIRONMENT_ATTEMPTS: '3'
        run: node src/pipeline/fetch_i2_run_environment.mjs

      - name: Run samples
        run: |
          set -e
          for i in $(seq -w 1 "$SAMPLE_COUNT"); do
            I2_DATE="$DATE" I2_CUTOFF="${DATE}T23:59:59Z" I2_TRIALS="$I2_TRIALS" \
            I2_OUTPUT="data/runtime/i2/${DATE}_fast_sample_${i}.json" \
            I2_LINEUP_OVERRIDES="data/runtime/i2/${DATE}_fast_overrides/sample_${i}.json" \
            I2_RUN_ENVIRONMENT="data/runtime/i2/${DATE}_fast_run_environment.json" \
            I2_TOTAL_PRIOR="data/derived/i2/i2_total_conditioned_prior.json" \
            I2_VENUE_PROFILES="data/runtime/i2/savant_venue_profiles_2026_3yr.json" \
            node src/pipeline/run_i2_total_conditioned.mjs
          done

      - name: Aggregate
        run: |
          python - <<'PY'
          import json,glob,statistics,os
          D=os.environ['DATE']; by={}
          for fn in sorted(glob.glob(f'data/runtime/i2/{D}_fast_sample_*.json')):
              p=json.load(open(fn))
              for g in p.get('games',[]):
                  if g.get('runEnvironmentConditioned'):by.setdefault(str(g['gamePk']),[]).append(g)
          def am(p):return round(-100*p/(1-p)) if p>=.5 else round(100*(1-p)/p)
          out=[]
          for gp,a in by.items():
              u=[float(x['under05']) for x in a]; m=sum(u)/len(u); b=a[0]
              ex={k:round(sum(float(x.get('fullI2Exact',{}).get(k,0)) for x in a)/len(a),2) for k in ['0','1','2','3','4+']}
              out.append({'gamePk':int(gp),'matchup':f"{b['away']} @ {b['home']}",'gameDate':b.get('gameDate'),'samples':len(a),'under05Pct':round(100*m,2),'over05Pct':round(100*(1-m),2),'fairUnder':am(m),'fairOver':am(1-m),'lineupUncertaintySdPct':round(100*(statistics.pstdev(u) if len(u)>1 else 0),2),'underRangePct':[round(100*min(u),2),round(100*max(u),2)],'top2ScorePct':round(sum(float(x['top2ScorePct']) for x in a)/len(a),2),'bottom2ScorePct':round(sum(float(x['bottom2ScorePct']) for x in a)/len(a),2),'fullI2Exact':ex,'runEnvironment':b.get('runEnvironment'),'predictionClass':'PRELIMINARY_FAST_PROBABILISTIC_SHADOW'})
          out.sort(key=lambda x:x['under05Pct'],reverse=True)
          for i,g in enumerate(out,1):g['rank']=i
          payload={'date':D,'status':'PRELIMINARY_SHADOW_NOT_BETTING_APPROVED','projectedGames':len(out),'games':out,'governance':{'confirmedLineupsRequiredForOfficial':True,'derivativeMarketDataUsed':False,'fullGameTotalPointOnlyPreFreeze':True}}
          json.dump(payload,open(f'data/runtime/i2/{D}_preliminary_fast_projection.json','w'),indent=2)
          print(json.dumps({'projectedGames':len(out),'ranking':[{'rank':g['rank'],'matchup':g['matchup'],'under':g['under05Pct'],'fairUnder':g['fairUnder'],'sd':g['lineupUncertaintySdPct'],'total':g['runEnvironment'].get('fullGameTotal')} for g in out]},indent=2))
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/i2/${DATE}_preliminary_fast_projection.json data/runtime/i2/${DATE}_fast_lineup_audit.json data/runtime/i2/${DATE}_fast_run_environment.json
          git commit -m "Add fast preliminary I2 projection ${DATE}" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
