name: I2 vNext Phase 30B V2 - aggregate arsenal gate

on:
  workflow_dispatch:
  push:
    branches:
      - research/i2-vnext-direct-talent
    paths:
      - '.github/workflows/i2_vnext_phase30b_aggregate_arsenal_gate.yml'

permissions:
  contents: write
  actions: read

env:
  HISTORY_RUN_ID: 36485385934

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy pandas requests
      - name: Restore archived annual arsenal
        run: |
          mkdir -p history
          gh run download "${HISTORY_RUN_ID}" --repo "$GITHUB_REPOSITORY" -n i2-vnext-phase19a-history-optimized -D history
      - name: Reconstruct 2024 directly from Savant aggregate search
        shell: bash
        run: |
          set -euo pipefail
          B=$(find history -name batter_2024.csv -print -quit)
          P=$(find history -name pitcher_2024.csv -print -quit)
          python src/research/build_i2_vnext_asof_arsenal_aggregate.py \
            --start 2024-01-01 --end 2024-12-31 \
            --archived-batter "$B" --archived-pitcher "$P" \
            --output-dir data/phase30b_v2/reconstruction_2024
      - name: Apply original precommitted equivalence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("data/phase30b_v2/reconstruction_2024/manifest.json").read_text())
          p=x["pitcher"]; b=x["batter"]
          gate={"pitch_share_weighted_mae_max":0.02,"batter_est_woba_weighted_mae_max":0.03,"batter_est_woba_abs_signed_error_max":0.01,"minimum_overlap_rows_each":1000}
          passed=(p["overlap_rows"]>=1000 and b["overlap_rows"]>=1000 and p["weighted_mae_pitch_share"]<=0.02 and b["weighted_mae_est_woba"]<=0.03 and abs(b["mean_signed_est_woba"])<=0.01)
          out={"version":"i2-vnext-phase30b-v2-aggregate-reconstruction-gate-v1","market_inputs_used":False,"production_changed":False,"thresholds_unchanged_from_original_gate":gate,"metrics":x,"passed":passed,"failure_action":"Stop before outcome scoring if false."}
          Path("data/derived/i2_vnext/PHASE30B_V2_AGGREGATE_ARSENAL_GATE.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          if not passed: raise SystemExit("aggregate reconstruction gate failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i2-vnext-phase30b-v2-aggregate-gate
          path: |
            data/phase30b_v2/reconstruction_2024/
            data/derived/i2_vnext/PHASE30B_V2_AGGREGATE_ARSENAL_GATE.json
          retention-days: 30
      - name: Commit passing gate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/i2_vnext/PHASE30B_V2_AGGREGATE_ARSENAL_GATE.json
          git commit -m "research: pass Phase 30B V2 arsenal reconstruction gate"
          git pull --rebase origin research/i2-vnext-direct-talent
          git push origin HEAD:research/i2-vnext-direct-talent
