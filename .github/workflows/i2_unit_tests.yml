name: I2 unit tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_unit_tests.yml'
      - 'src/model/i2_total_conditioning.js'
      - 'tests/i2_total_conditioning.test.mjs'
      - 'package.json'
      - 'src/inputs/**'
      - 'tests/i2_source*'
      - 'tests/fixtures/i2_*'
      - 'src/pipeline/run_i2_today.mjs'
      - 'src/market/sportsgameodds_data_source.mjs'
      - 'tests/sportsgameodds_data_source.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source governance and production parity
        run: node --test tests/i2_source_governance.test.mjs tests/i2_source_integration.test.mjs
      - name: Test total-conditioning invariants
        run: node tests/i2_total_conditioning.test.mjs
      - name: Test SportsGameOdds post-freeze adapter
        run: node tests/sportsgameodds_data_source.test.mjs
