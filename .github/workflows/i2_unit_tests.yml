name: I2 unit tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/i2_unit_tests.yml'
      - 'src/model/i2_total_conditioning.js'
      - 'tests/i2_total_conditioning.test.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test total-conditioning invariants
        run: node tests/i2_total_conditioning.test.mjs
