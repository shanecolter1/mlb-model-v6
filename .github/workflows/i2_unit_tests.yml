name: I2 unit tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/workflows/i2_unit_tests.yml'
      - 'src/model/i2_total_conditioning.js'
      - 'tests/i2_total_conditioning.test.mjs'
      - 'package.json'
      - 'src/inputs/**'
      - 'tests/i2_source*'
      - 'tests/i2_self_contained_pipeline.test.mjs'
      - 'tests/i2_rotowire_public.test.mjs'
      - 'tests/fixtures/i2_*'
      - 'src/pipeline/run_i2_today.mjs'
      - 'src/market/sportsgameodds_data_source.mjs'
      - 'tests/sportsgameodds_data_source.test.mjs'
      - 'src/model/i2_price_dependent_recommendations.mjs'
      - 'src/pipeline/build_i2_market_range_report.mjs'
      - 'src/pipeline/*sgo*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source governance, production parity, and self-contained pipeline
        run: node --test tests/i2_source_governance.test.mjs tests/i2_source_integration.test.mjs tests/i2_self_contained_pipeline.test.mjs
      - name: Test public RotoWire parser
        run: node --test tests/i2_rotowire_public.test.mjs
      - name: Check live public RotoWire access without API credentials
        continue-on-error: true
        env:
          I2_TEST_LIVE_ROTOWIRE: '1'
        run: node --test tests/i2_rotowire_public.test.mjs
      - name: Test total-conditioning invariants
        run: node tests/i2_total_conditioning.test.mjs
      - name: Test SportsGameOdds post-freeze adapter
        run: node tests/sportsgameodds_data_source.test.mjs
      - name: Check I2 market reporting syntax
        run: |
          node --check src/pipeline/*sgo*
          node --check src/pipeline/build_i2_market_range_report.mjs
          node --check src/model/i2_price_dependent_recommendations.mjs
