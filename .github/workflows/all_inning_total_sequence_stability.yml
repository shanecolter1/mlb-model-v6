name: All inning-total sequence stability
on:
  push:
    branches: [research/all-inning-engine-rebuild]
    paths:
      - 'src/analysis/all_inning_total_sequence_stability.py'
      - '.github/workflows/all_inning_total_sequence_stability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/all-inning-engine-rebuild}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy tabulate
      - run: python src/analysis/all_inning_total_sequence_stability.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/ALL_INNING_TOTAL_GAME_SEQUENCE_STABILITY_2021_2025.md data/derived/all_inning/all_inning_total_sequence_stability_2021_2025.csv
          git diff --cached --quiet || git commit -m 'Add all inning-total sequence stability results'
          git push